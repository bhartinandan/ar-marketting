<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <title>AliveFrame AR Experience</title>
  <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
 <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
 <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
    overflow-y: hidden !important;
        margin: 0;
      overflow: hidden;
      height:100vh;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
    }

    #messageBox,
    #tapNotification {
      position: absolute;
      margin-top: 5rem;
      z-index: 100;
      text-align: center;
      color: #fff;
      width: 100%;
      font-size: 1.4rem;
      font-weight: 600;
      animation: pulse 1.2s infinite ease-in-out, glow 2s infinite alternate;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #00CFFF, 0 0 10px #7B61FF, 0 0 15px #8A2EFF;
      }
      to {
        text-shadow: 0 0 10px #00CFFF, 0 0 20px #7B61FF, 0 0 30px #8A2EFF;
      }
    }

    #messageBox { top: 20px; }
    #tapNotification { display: none; }

    #targetOverlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50vw;
      opacity: 0.95;
      pointer-events: none;
      z-index: 99;
      box-shadow: 0 0 40px rgba(0, 198, 255, 0.25);
      background-color: rgba(255, 255, 255, 0.02);
    }

    #visitButton {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #7f00ff;
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 2rem;
      z-index: 101;
      width: 80%;
      text-decoration: none;
      display: none;
      opacity:.8;
    }

    .footer {
      position: absolute;
      bottom: 0px;
      width: 100%;
      text-align: center;
      color: #aaa;
      font-size: 12px;
      font-weight: 400;
      z-index: 101;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 0;
    }

    a-scene {
      height: 100vh;
      width: 100vw;
    }
    
    /* Example usage */

    body, p, .footer, #messageBox,h1, .cta, #visitButton {
  font-family: 'Poppins', sans-serif;

    }
    .a-loader {
  display: none !important;
}

#customLoader {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background-color: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
}

  </style>
</head>
<body>
  <div id="messageBox">Place Camera On Poster</div>
  <div id="tapNotification">Tap Anywhere to Start</div>
  <img id="targetOverlay" src="{{media.reference_img.url}}" alt="Target Overlay" />
  <a id="visitButton" href="{{media.redirect_url}}" target="_blank">
    Register now <i class="fa-solid fa-arrow-right-long"></i>
  </a>
  <div class="footer">Powered by Aliveframe</div>
<div id="customLoader">
  <img src="{% static 'logo.png' %}" alt="AliveFrame Logo" style="width:194px; animation: pulse 1.4s infinite ease-in-out;" />
  <p style="margin-top: 0.8rem; font-weight: 500; color: white;">Loading AR Experience...</p>
</div>

  <a-scene
    mindar-image="imageTargetSrc: {{media.target_img.url}}; minCameraResolution: {width: 1920, height: 1080}; displayFov: 70; filterMinCF: 0.2; filterBeta: 0.9; maxTrack: 1;uiScanning: false;"
    color-space="sRGB"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <video
        id="myVideo"
        src="{{media.overlap_video.url}}"
        preload="auto"
        loop
        playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0">
      <a-entity id="videoWrapper" position="0 0 0" rotation="0 0 0">
        <a-plane
          id="videoPlane"
			width="{{media.width}}"
			height="{{media.height}}"
			position="0 0 0"
          material="shader: flat; src: #myVideo;"
          visible="false"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const videoEl = document.getElementById("myVideo");
      const videoPlane = document.getElementById("videoPlane");
      const messageBox = document.getElementById("messageBox");
      const overlayImg = document.getElementById("targetOverlay");
      const tapNotification = document.getElementById("tapNotification");
      const targetAnchor = document.getElementById("targetAnchor");
      const visitBtn = document.getElementById("visitButton");

      let videoPlaying = false;
      let targetFound = false;
      let tapHandledOnce = false;
      let buttonShownOnce = false;

      const startVideo = () => {
        videoEl.play().then(() => {
          videoPlaying = true;
          videoPlane.setAttribute("visible", "true");
          tapNotification.style.display = "none";

          if (!buttonShownOnce) {
            setTimeout(() => {
              visitBtn.style.display = "flex";
              buttonShownOnce = true;
            }, 5000);
          } else {
            visitBtn.style.display = "flex";
          }

        }).catch((err) => {
          console.error("Video error:", err);
          messageBox.textContent = "Tap again to allow video with sound.";
          messageBox.style.display = "block";
        });
      };

      targetAnchor.addEventListener("targetFound", () => {
        targetFound = true;
        messageBox.style.display = "none";
        overlayImg.style.display = "none";

        if (!tapHandledOnce) {
          tapNotification.style.display = "block";
        } else {
          startVideo();
        }
      });

      targetAnchor.addEventListener("targetLost", () => {
        videoPlane.setAttribute("visible", "false");
        if (videoPlaying) {
          videoEl.pause();
          videoPlaying = false;
        }
        overlayImg.style.display = "block";
        messageBox.textContent = "Place Camera On Poster";
        messageBox.style.display = "block";
        tapNotification.style.display = "none";
        visitBtn.style.display = buttonShownOnce ? "flex" : "none";
        targetFound = false;
      });

      document.body.addEventListener("click", () => {
        if (targetFound && !tapHandledOnce) {
          startVideo();
          tapHandledOnce = true;
        }
      });
    });
    
    
    window.addEventListener("load", () => {
  // Wait for MindAR to start
  const sceneEl = document.querySelector('a-scene');
  sceneEl.addEventListener("renderstart", () => {
    const loader = document.getElementById("customLoader");
    if (loader) loader.style.display = "none";
  });
});

  </script>
</body>
</html>
