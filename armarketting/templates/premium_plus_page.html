<!DOCTYPE html>
<html>
  <head>
    {% load static %}
    <meta charset="utf-8" />
    <title>AR experience with AliveFrame</title>
    <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
      }
      a-scene {
        height: 100vh;
        width: 100vw;
      }
      #messageBox,
      #tapNotification {
          position: absolute;
      margin-top:5rem;
      z-index: 100;
      text-align: center;
      color: #fff;
        text-shadow: black;
      width:100%;
  font-size: 1.4rem;
  z-index: 100;
  font-weight: 600;
   animation: pulse 1.2s infinite ease-in-out, glow 2s infinite alternate;
    }
      #messageBox {
        top: 20px;
      }
      #tapNotification {
        top: 10%;
        font-size: 16px;
        display: none;
      }
      #targetOverlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50vw;
        opacity: 0.95;
        pointer-events: none;
        z-index: 99;
        border-radius: 4px;
        box-shadow: 0 0 40px rgba(0, 198, 255, 0.25);
        background-color: rgba(255, 255, 255, 0.02);
      }
      #visitButton {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #7f00ff;
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height:3rem;
      z-index: 101;
      width: 80%;
      text-decoration: none;
    }
      .footer {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        color: #aaa;
        font-size: 12px;
        font-weight: 400;
        z-index: 101;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 0;
      }
      #greenscreen-canvas {
        display: none;
      }
      
       @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #00CFFF, 0 0 10px #7B61FF, 0 0 15px #8A2EFF;
      }
      to {
        text-shadow: 0 0 10px #00CFFF, 0 0 20px #7B61FF, 0 0 30px #8A2EFF;
      }
    }
    </style>
  </head>
  <body>
    <div id="messageBox">Scan This Poster </div>
    <div id="tapNotification">Tap Anywhere to Start</div>
    <canvas id="greenscreen-canvas"></canvas>
    <img
      id="targetOverlay"
      src="{{media.reference_img.url}}"
      alt="Target Overlay"
    />
    <a id="visitButton" href="{{media.redirect_url}}" target="_blank">
      Register now <i class="fa-solid fa-arrow-right-long"></i>
    </a>

    <a-scene
      mindar-image="imageTargetSrc: {{media.target_img.url}};
                     filterMinCF: 0.5;
                     filterBeta: 0.1;
                     filterMaxDist: 0.2;
                     maxTrack: 1;
                     uiScanning: #messageBox;
                     uiLoading: #messageBox;"
      color-space="sRGB"
      renderer="logarithmicDepthBuffer: true; antialias: true; precision: highp;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <video
          id="myVideo"
          src="{{media.overlap_video.url}}"
          preload="auto"
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane"
          material="shader: flat; src: #greenscreen-canvas; transparent: true; side: double;"
          width="{{media.width}}"
          height="{{media.height}}"
          position="0 0 0"
          rotation="0 0 0"
          visible="false"
        ></a-video>
      </a-entity>
    </a-scene>

    <div class="footer">Powered by Aliveframe</div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const videoEl = document.getElementById("myVideo");
        const canvas = document.getElementById("greenscreen-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const videoPlane = document.getElementById("videoPlane");
        const messageBox = document.getElementById("messageBox");
        const targetAnchor = document.getElementById("targetAnchor");
        const overlayImg = document.getElementById("targetOverlay");
        const tapNotification = document.getElementById("tapNotification");

        let videoPlaying = false;
        let targetFound = false;
        let userHasTapped = false;
        let hasClickListener = false;
        let renderStarted = false;
        let prevTargetPosition = { x: 0, y: 0, z: 0 };
        const smoothingFactor = 0.01;
        const scale = 0.75;

        function smoothPosition(targetPosition) {
          const dx = targetPosition.x - prevTargetPosition.x;
          const dy = targetPosition.y - prevTargetPosition.y;
          const dz = targetPosition.z - prevTargetPosition.z;
          const smoothed = {
            x: prevTargetPosition.x + dx * smoothingFactor,
            y: prevTargetPosition.y + dy * smoothingFactor,
            z: prevTargetPosition.z + dz * smoothingFactor,
          };
          prevTargetPosition = smoothed;
          return smoothed;
        }

        function renderGreenScreen() {
          if (videoEl.readyState >= 2 && videoPlaying) {
            const w = videoEl.videoWidth * scale;
            const h = videoEl.videoHeight * scale;
            if (canvas.width !== w || canvas.height !== h) {
              canvas.width = w;
              canvas.height = h;
            }

            ctx.drawImage(videoEl, 0, 0, w, h);
            const frame = ctx.getImageData(0, 0, w, h);
            const data = frame.data;

            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];

              const max = Math.max(r, g, b);
              const min = Math.min(r, g, b);
              const delta = max - min;

              let h = 0;
              let s = 0;
              if (delta !== 0) {
                if (max === r) h = 60 * (((g - b) / delta) % 6);
                else if (max === g) h = 60 * ((b - r) / delta + 2);
                else h = 60 * ((r - g) / delta + 4);
                s = delta / max;
              }

              h = (h + 360) % 360;
              const brightness = 0.299 * r + 0.587 * g + 0.114 * b;

              // Apply chroma key for green color
              if (h >= 120 && h <= 140 && s >= 0.45 && g > r && g > b && brightness > 60) {
                data[i + 3] = 0; // Set alpha to 0 (transparent)
              }
            }

            ctx.putImageData(frame, 0, 0);
            const material = videoPlane.getObject3D("mesh")?.material;
            if (material?.map) material.map.needsUpdate = true;
          }

          // Request next frame at 60fps
          requestAnimationFrame(renderGreenScreen); // 60 FPS
        }

        targetAnchor.addEventListener("targetFound", () => {
          targetFound = true;
          overlayImg.style.display = "none";
          messageBox.style.display = "none";

          if (!userHasTapped) {
            tapNotification.style.display = "block";
            if (!hasClickListener) {
              hasClickListener = true;
              document.body.addEventListener("click", () => {
                if (targetFound && !userHasTapped) {
                  videoEl.play().then(() => {
                    userHasTapped = true;
                    videoPlaying = true;
                    videoPlane.setAttribute("visible", "true");
                    tapNotification.style.display = "none";
                    if (!renderStarted) {
                      renderStarted = true;
                      renderGreenScreen();
                    }
                  }).catch((err) => {
                    console.error("Video error:", err);
                    messageBox.textContent = "Tap again to allow video with sound.";
                    messageBox.style.display = "block";
                  });
                }
              });
            }
          } else {
            videoEl.play().then(() => {
              videoPlaying = true;
              videoPlane.setAttribute("visible", "true");
            });
          }
        });

        targetAnchor.addEventListener("targetLost", () => {
          videoPlane.setAttribute("visible", "false");
          overlayImg.style.display = "block";
          if (videoPlaying) {
            videoEl.pause();
            videoEl.currentTime = 0;
            videoPlaying = false;
          }
          messageBox.textContent = "Place Camera On Poster";
          messageBox.style.display = "block";
          tapNotification.style.display="none";
          targetFound = false;
        });

        const target = targetAnchor.object3D;
        function updatePosition() {
          if (targetFound) {
            const smoothed = smoothPosition(target.position);
            videoPlane.setAttribute("position", smoothed);

            const currentRot = videoPlane.getAttribute("rotation");
            const targetRot = target.rotation;
            const smoothedRot = {
              x: currentRot.x + (targetRot.x - currentRot.x) * smoothingFactor,
              y: currentRot.y + (targetRot.y - currentRot.y) * smoothingFactor,
              z: currentRot.z + (targetRot.z - currentRot.z) * smoothingFactor,
            };
            videoPlane.setAttribute("rotation", smoothedRot);
          }
          requestAnimationFrame(updatePosition);
        }

        updatePosition();
      });
    </script>
  </body>
</html>
