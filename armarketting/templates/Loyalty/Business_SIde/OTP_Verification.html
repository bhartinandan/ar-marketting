<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b3d" />
  <title>Aliveframe LOYALTY — Verify your number</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ["Inter", "sans-serif"]
          },
          colors: {
            alive: {
              navy: "#070b3d",
              navy2: "#0b1154",
              blue: "#237dff",
              cyan: "#19d5e8",
              purple: "#823cff",
              pink: "#d936ff"
            }
          },
          boxShadow: {
            alive: "0 30px 90px rgba(7, 13, 65, .15)"
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f6f8ff] font-inter text-[#0b1234]">

  <!-- Background glow from the supplied theme -->
  <div class="pointer-events-none fixed -right-40 -top-40 h-[420px] w-[420px] rounded-full bg-[#237dff]/20 blur-3xl"></div>
  <div class="pointer-events-none fixed -bottom-48 -left-48 h-[420px] w-[420px] rounded-full bg-[#823cff]/10 blur-3xl"></div>

  <main class="mx-auto flex min-h-screen w-full max-w-[1180px] items-center justify-center px-4 py-6 sm:px-6 lg:px-10">

    <!-- Verification card -->
    <section
      class="relative flex min-h-[650px] w-full max-w-[560px] flex-col overflow-hidden rounded-[26px] border border-black/[.07] bg-white/[.94] p-[22px] shadow-alive backdrop-blur sm:min-h-[690px] sm:rounded-[30px] sm:p-[38px]"
    >

      <!-- Progress -->
      <div class="mb-9 flex gap-2 sm:mb-[52px]">
        <span class="h-[5px] w-[54px] rounded-full bg-gradient-to-r from-[#722cf5] to-[#1ed3e8]"></span>
        <span class="h-[5px] w-6 rounded-full bg-gradient-to-r from-[#722cf5] to-[#1ed3e8]"></span>
        <span class="h-[5px] w-6 rounded-full bg-[#dfe2eb]"></span>
      </div>

      <!-- Heading -->
      <div>
        <div class="mb-2 text-[26px] leading-none text-alive-purple">✦</div>

        <h1 class="text-[30px] font-extrabold leading-tight tracking-[-.045em] text-alive-navy sm:text-[38px]">
          Verify your number
        </h1>

        <p class="mt-3.5 text-[13px] leading-6 text-[#73778a] sm:text-sm">
          We've sent a 4-digit code on
          <!-- <span class="font-bold text-[#22b968]">WhatsApp</span>
          to  -->
          <span id="maskedNumber" class="font-semibold text-[#4b5062]">+91 {{mobile}}</span>
        </p>
      </div>

      <!-- OTP -->
      <div class="mt-10 sm:mt-12">
        <label class="mb-4 block text-center text-[14px] font-semibold text-[#23283c]">
          Enter 4-digit code
        </label>
        <form method="POST" action="" id="otpForm" class="mt-10 sm:mt-12">
    {% csrf_token %}

        <div id="otpGroup" class="mx-auto flex max-w-[390px] justify-center gap-3 sm:gap-4">
          <input name="otp1" id="otp1" aria-label="OTP digit 1" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
            class="otp-box h-[68px] w-[68px] rounded-[17px] border border-transparent bg-[#eef1ed] text-center text-2xl font-extrabold text-[#11182e] outline-none transition focus:border-[#5a40e6]/30 focus:ring-4 focus:ring-[#5a40e6]/10 sm:h-[78px] sm:w-[78px]" />
          <input name="otp2" id="otp2" aria-label="OTP digit 2" maxlength="1" inputmode="numeric"
            class="otp-box h-[68px] w-[68px] rounded-[17px] border border-transparent bg-[#eef1ed] text-center text-2xl font-extrabold text-[#11182e] outline-none transition focus:border-[#5a40e6]/30 focus:ring-4 focus:ring-[#5a40e6]/10 sm:h-[78px] sm:w-[78px]" />
          <input name="otp3" id="otp3" aria-label="OTP digit 3" maxlength="1" inputmode="numeric"
            class="otp-box h-[68px] w-[68px] rounded-[17px] border border-transparent bg-[#eef1ed] text-center text-2xl font-extrabold text-[#11182e] outline-none transition focus:border-[#5a40e6]/30 focus:ring-4 focus:ring-[#5a40e6]/10 sm:h-[78px] sm:w-[78px]" />
          <input name="otp4" id="otp4" aria-label="OTP digit 4" maxlength="1" inputmode="numeric"
            class="otp-box h-[68px] w-[68px] rounded-[17px] border border-transparent bg-[#eef1ed] text-center text-2xl font-extrabold text-[#11182e] outline-none transition focus:border-[#5a40e6]/30 focus:ring-4 focus:ring-[#5a40e6]/10 sm:h-[78px] sm:w-[78px]" />
        </div>
        <input type="hidden" name="action" value="verify">

        <!-- Verify button -->
        <button
          id="verifyBtn"
          type="submit"
          class="mt-7 flex h-[58px] w-full items-center justify-center gap-2 rounded-[17px] bg-gradient-to-r from-[#5131dc] to-[#0f9eea] text-base font-extrabold text-white shadow-lg shadow-[#4e39d6]/20 transition hover:-translate-y-0.5 hover:shadow-xl hover:shadow-[#4e39d6]/30 active:translate-y-0 sm:h-[60px]"
        >
          Verify &amp; Continue
          <span class="text-[25px] font-normal">→</span>
        </button>
        </form>
        

        <!-- Resend -->
         <form id="resendForm" method="POST" action="" class="mt-5">
        {% csrf_token %}
         <input type="hidden" name="action" value="resend">
        <button
          id="resendBtn"
          type="button"
          disabled
          class="mx-auto mt-5 flex items-center justify-center gap-2 text-sm font-semibold text-[#a1a5b1] disabled:cursor-default"
        >
          <span class="text-base">↻</span>
          <span id="resendText">Resend in 56s</span>
        </button>
        </form>

        <!-- Change number -->
        <button
          type="button"
          class="mx-auto mt-7 block text-sm font-semibold text-[#5d6372] transition hover:text-[#5238c7]"
          onclick="history.back()"
        >
          ← Change number
        </button>
      </div>

      <!-- Trust row -->
      <div class="mt-auto flex justify-center gap-2 pt-8 text-[11px] text-[#9a9eab]">
        <span>Secure &amp; simple</span>
        <span class="text-[#c7cad3]">•</span>
        <span>WhatsApp verification</span>
      </div>

      <!-- Terms -->
      <p class="pt-7 text-center text-[10px] leading-6 text-[#74798a]">
        By proceeding, you agree to Druto's
        <a href="#" class="font-bold text-[#5238c7]">T&amp;C</a>
        and
        <a href="#" class="font-bold text-[#5238c7]">Privacy Policy</a>
      </p>
    </section>
  </main>

  <!-- Toast -->
  <div
    id="toast"
    class="fixed bottom-7 left-1/2 z-50 max-w-[calc(100%-32px)] -translate-x-1/2 translate-y-32 rounded-xl bg-[#111738] px-[18px] py-[13px] text-[13px] font-semibold text-white opacity-0 shadow-2xl transition-all duration-300"
  ></div>

  <script>
    const otpInputs = [...document.querySelectorAll(".otp-box")];
    const verifyBtn = document.querySelector("#verifyBtn");
    const resendBtn = document.querySelector("#resendBtn");
    const resendText = document.querySelector("#resendText");
    const toast = document.querySelector("#toast");
    let resendTimer = null;

    function sendOTP() {

    startResendTimer();

    fetch("/loyalty/send-otp", {

        method: "POST",

        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "X-Requested-With": "XMLHttpRequest"
        }

    })
    .then(response => response.json())
    .then(data => {

        if (data.status) {

            showToast("OTP sent successfully.");

        } else {

            showToast(data.message || "Unable to send OTP.");

            // Stop timer if API failed
            clearInterval(resendTimer);
            resendTimer = null;

            resendBtn.disabled = false;
            resendBtn.classList.remove("text-[#a1a5b1]");
            resendBtn.classList.add("text-[#5238c7]");
            resendText.textContent = "Resend code";
        }

    })
    .catch(error => {

        console.error(error);

        showToast("Something went wrong.");

        clearInterval(resendTimer);
        resendTimer = null;

        resendBtn.disabled = false;
        resendBtn.classList.remove("text-[#a1a5b1]");
        resendBtn.classList.add("text-[#5238c7]");
        resendText.textContent = "Resend code";

    });

}

    // OTP input behavior
    otpInputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });

      input.addEventListener("paste", (event) => {
        event.preventDefault();
        const pasted = (event.clipboardData || window.clipboardData)
          .getData("text")
          .replace(/\D/g, "")
          .slice(0, 4);

        pasted.split("").forEach((digit, i) => {
          if (otpInputs[i]) otpInputs[i].value = digit;
        });

        const next = Math.min(pasted.length, 3);
        otpInputs[next].focus();
      });
    });

    const otpForm = document.querySelector("#otpForm");

    otpForm.addEventListener("submit", function (event) {

        const code = otpInputs.map(input => input.value).join("");

        if (code.length !== 4) {
            event.preventDefault();

            showToast("Please enter the 4-digit verification code.");

            otpInputs.find(input => !input.value)?.focus();

            return;
        }

        // Allow normal POST request
      });

    // verifyBtn.addEventListener("click", () => {
    //   const code = otpInputs.map(input => input.value).join("");

    //   if (code.length !== 4) {
    //     showToast("Please enter the 4-digit verification code.");
    //     otpInputs.find(input => !input.value)?.focus();
    //     return;
    //   }

    //   // Demo behavior — replace with your real verification API.
    //   showToast(`Demo: verification code ${code} submitted.`);
    // });

    // let seconds = 56;

    // const countdown = setInterval(() => {
    //   seconds--;

    //   if (seconds <= 0) {
    //     clearInterval(countdown);
    //     resendBtn.disabled = false;
    //     resendBtn.classList.remove("text-[#a1a5b1]");
    //     resendBtn.classList.add("text-[#5238c7]");
    //     resendText.textContent = "Resend code";
    //     return;
    //   }

    //   resendText.textContent = `Resend in ${seconds}s`;
    // }, 1000);

    // resendBtn.addEventListener("click", () => {
    //   if (resendBtn.disabled) return;

    //   showToast("A new verification code has been sent on WhatsApp.");
    //   resendBtn.disabled = true;
    //   resendBtn.classList.remove("text-[#5238c7]");
    //   resendBtn.classList.add("text-[#a1a5b1]");

    //   seconds = 56;
    //   resendText.textContent = `Resend in ${seconds}s`;

    //   const restart = setInterval(() => {
    //     seconds--;

    //     if (seconds <= 0) {
    //       clearInterval(restart);
    //       resendBtn.disabled = false;
    //       resendBtn.classList.remove("text-[#a1a5b1]");
    //       resendBtn.classList.add("text-[#5238c7]");
    //       resendText.textContent = "Resend code";
    //       return;
    //     }

    //     resendText.textContent = `Resend in ${seconds}s`;
    //   }, 1000);
    // });

    function startResendTimer() {

    // Stop any existing timer
    if (resendTimer) {
        clearInterval(resendTimer);
    }

    let seconds = 56;

    resendBtn.disabled = true;

    resendBtn.classList.remove("text-[#5238c7]");
    resendBtn.classList.add("text-[#a1a5b1]");

    resendText.textContent = `Resend in ${seconds}s`;

    resendTimer = setInterval(function () {

        seconds--;

        if (seconds > 0) {

            resendText.textContent = `Resend in ${seconds}s`;

        } else {

            clearInterval(resendTimer);
            resendTimer = null;

            resendBtn.disabled = false;

            resendBtn.classList.remove("text-[#a1a5b1]");
            resendBtn.classList.add("text-[#5238c7]");

            resendText.textContent = "Resend code";
        }

    }, 1000);
}

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("translate-y-32", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("translate-y-32", "opacity-0");
      }, 4200);
    }

    resendBtn.addEventListener("click", function () {

    if (resendBtn.disabled) return;

    sendOTP();

});
    window.onload = function () {

    sendOTP();

};

  </script>
</body>
</html>
