<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b3d" />
  <title>AliveFrame — Winners</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ["Inter", "sans-serif"] },
          colors: {
            alive: {
              navy: "#070b3d", navy2: "#0b1154", blue: "#237dff",
              cyan: "#19d5e8", purple: "#823cff", pink: "#d936ff",
            },
          },
          boxShadow: { alive: "0 30px 90px rgba(7, 13, 65, .15)" },
        },
      },
    };
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f6f8ff] font-inter text-[#0b1234]">

  <div class="pointer-events-none fixed -right-40 -top-40 h-[420px] w-[420px] rounded-full bg-[#237dff]/20 blur-3xl"></div>

  <div class="relative mx-auto w-full max-w-[480px] pb-28">

    <!-- TRIAL BANNER -->
    <div id="trialBanner" class="flex items-center gap-3 bg-gradient-to-r from-alive-purple to-alive-blue px-4 py-3 text-white">
      <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      <p class="flex-1 text-sm font-semibold leading-snug">Your trial period expires in <b id="trialDays">2</b> days</p>
      <button id="upgradeBtn" type="button" class="rounded-full bg-white px-5 py-2.5 text-center text-sm font-extrabold leading-tight text-alive-purple transition hover:-translate-y-0.5">Upgrade<br />Now</button>
    </div>

    <!-- HEADER -->
    <header class="-mt-px rounded-b-[34px] bg-gradient-to-br from-alive-navy via-alive-navy2 to-[#2a1a8f] px-4 pb-14 pt-6 text-white shadow-alive">
      <div class="flex items-center gap-3">
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-white text-xl font-extrabold text-alive-purple">A</div>
        <div class="min-w-0 flex-1">
          <h1 id="bizName" class="truncate text-xl font-extrabold tracking-[-0.03em]">Aryan Resturant</h1>
          <!-- <span class="mt-1 inline-block rounded-full bg-gradient-to-r from-alive-purple to-alive-cyan px-3 py-0.5 text-[11px] font-bold">Basic Subscription</span> -->
        </div>
        <button id="profileBtn" type="button" aria-label="Profile" onclick="window.location.href='/loyalty/business-profile'" class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 transition hover:bg-white/20">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
      </div>
    </header>

    <!-- TAB SWITCHER (overlaps header) -->
    <div class="relative z-10 -mt-8 px-4">
      <div role="tablist" class="grid grid-cols-2 rounded-full border border-black/[.05] bg-white p-1.5 shadow-alive">
        <button id="tab-stamp" role="tab" type="button" data-tab="stamp" class="tab-btn flex items-center justify-center gap-2 rounded-full px-3 py-3 text-[15px] font-bold transition">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 8 8 12 8zm0 0s2-5 4.5-3.5S16 8 12 8z"/></svg>
          Stamp Cards <span id="count-stamp" class="count rounded-full px-2 py-0.5 text-xs font-extrabold">0</span>
        </button>
        <button id="tab-scratch" role="tab" type="button" data-tab="scratch" class="tab-btn flex items-center justify-center gap-2 rounded-full px-3 py-3 text-[15px] font-bold transition">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>
          Scratch Cards <span id="count-scratch" class="count rounded-full px-2 py-0.5 text-xs font-extrabold">0</span>
        </button>
      </div>
    </div>

    <main class="px-4 pt-5">

      <!-- SEARCH -->
      <label class="flex h-[54px] items-center gap-3 rounded-[17px] border border-black/[.07] bg-white px-4 shadow-sm transition focus-within:border-[#5a40e6]/30 focus-within:ring-4 focus-within:ring-[#5a40e6]/10">
        <svg class="h-5 w-5 shrink-0 text-[#9da2ad]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search by name or phone..." class="w-full min-w-0 border-0 bg-transparent text-[15px] text-[#11182e] outline-none placeholder:text-[#9da2ad]" />
      </label>

      <!-- INFO NOTE -->
      <div class="mt-4 flex items-center gap-3 rounded-[17px] border border-black/[.05] bg-white px-4 py-3.5 shadow-sm">
        <svg class="h-6 w-6 shrink-0 text-alive-purple" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 8 8 12 8zm0 0s2-5 4.5-3.5S16 8 12 8z"/></svg>
        <p class="text-[13px] leading-snug text-[#636981]">Shows <b class="text-[#23283c]">claimed rewards</b>. Requests requiring action are shown at the top.</p>
      </div>

      <!-- STATUS FILTER -->
      <div id="chips" class="no-scrollbar -mx-4 mt-4 flex gap-2.5 overflow-x-auto px-4"></div>

      <!-- LIST -->
      <section id="list" class="mt-4 space-y-3" aria-live="polite"></section>
    </main>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed inset-x-0 bottom-0 z-40 border-t border-black/[.07] bg-white/95 backdrop-blur">
    <div class="mx-auto grid max-w-[480px] grid-cols-4">
      <a onclick="window.location.href ='/loyalty/business-dashboard'" class="flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold text-[#747887]">
        <span class="flex h-8 w-14 items-center justify-center rounded-full"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Home
      </a>
      <a onclick="window.location.href ='/loyalty/customers-list'" class="flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold text-[#747887]">
        <span class="flex h-8 w-14 items-center justify-center rounded-full"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M17 4.5a3.5 3.5 0 010 7M22 20c0-2.5-1.5-4-4-5"/></svg></span>Customers
      </a>
      <a onclick="window.location.href ='/loyalty/winners-list'" aria-current="page" class="relative flex flex-col items-center gap-1 py-2.5 text-[11px] font-bold text-alive-purple">
        <span class="absolute left-3 top-0 h-[3px] w-12 rounded-full bg-gradient-to-r from-alive-purple to-alive-cyan"></span>
        <span class="flex h-8 w-14 items-center justify-center rounded-full bg-alive-purple/10"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13"/></svg></span>Winners
      </a>
      <button onclick="window.location.href ='/loyalty/create-offer'" data-soon="Create Offer" type="button" class="flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold text-[#747887]">
        <span class="flex h-8 w-14 items-center justify-center rounded-full"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>Create Offer
      </button>
    </div>
  </nav>

  <div id="toast" class="fixed bottom-24 left-1/2 z-50 max-w-[calc(100%-32px)] -translate-x-1/2 translate-y-32 rounded-xl bg-[#111738] px-[18px] py-[13px] text-[13px] font-semibold text-white opacity-0 shadow-2xl transition-all duration-300"></div>

  <script>
    /* ---------------------------------
       DATA — replace with your API data
       status: "pending" | "redeemed" | "declined"
       Timestamps are ISO strings.
    --------------------------------- */
    const csrfToken = "{{ csrf_token }}";
    const data = {
      businessName: "{{business_user_profile_name}}",
      trialDaysLeft: -1,
      stampClaims: JSON.parse('{{ approval_awating_customers|escapejs }}'),
      // [
      //   {
      //     id: "s1", name: "Aryan kumar", phone: "919608528294",
      //     milestone: "1 stamp milestone", reward: "After 5 visit",
      //     claimedAt: "2026-10-07T14:46:11+05:30", redeemedAt: null, status: "pending",
      //   },
      // ],
      scratchClaims: [
        // { id: "c1", name: "...", phone: "...", prize: "Free dessert", reward: "Scratch card prize",
        //   claimedAt: "...", redeemedAt: null, status: "pending" },
      ],
    };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    $("bizName").textContent = data.businessName;
    $("trialDays").textContent = data.trialDaysLeft;
    // Trial banner (hidden once the trial has ended or the business has subscribed)
    const trialLeft = data.trialDaysLeft;
    $("trialBanner").classList.toggle("hidden", !(trialLeft > 0));
    

    const fmt = (iso) => new Date(iso).toLocaleString("en-US", {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true,
    }).replace(",", "").replace(/^(\w+ \d+) /, "$1, ").replace(/ (AM|PM)$/, (m) => m.toLowerCase());

    const badges = {
      pending:  ["ACTION NEEDED", "bg-[#fff3d6] text-[#b45f06]"],
      redeemed: ["REDEEMED", "bg-[#e3f9ec] text-[#16a058]"],
      declined: ["DECLINED", "bg-[#fde8ea] text-[#c0262d]"],
    };

    let tab = "stamp", statusFilter = "all";
    const declining = new Set();

    const claims = () => (tab === "stamp" ? data.stampClaims : data.scratchClaims);

    /* ---------------------------------
       RENDER
    --------------------------------- */
    function renderTabs() {
      $("count-stamp").textContent = data.stampClaims.length;
      $("count-scratch").textContent = data.scratchClaims.length;
      document.querySelectorAll(".tab-btn").forEach((b) => {
        const on = b.dataset.tab === tab;
        b.setAttribute("aria-selected", on);
        b.className = `tab-btn flex items-center justify-center gap-2 rounded-full px-3 py-3 text-[15px] font-bold transition ${
          on ? "bg-gradient-to-r from-[#5131dc] to-[#0f9eea] text-white shadow-lg shadow-[#4e39d6]/25" : "text-[#747887] hover:bg-[#f3f4fa]"}`;
        b.querySelector(".count").className = `count rounded-full px-2 py-0.5 text-xs font-extrabold ${
          on ? "bg-white text-alive-purple" : "bg-[#edf0f4] text-[#636981]"}`;
      });
    }

    function renderChips() {
      const list = claims();
      const defs = [["all", "All"], ["pending", "Action needed"], ["redeemed", "Redeemed"], ["declined", "Declined"]];
      $("chips").innerHTML = defs.map(([k, label]) => {
        const n = k === "all" ? list.length : list.filter((c) => c.status === k).length;
        const on = k === statusFilter;
        return `<button type="button" data-chip="${k}" class="shrink-0 whitespace-nowrap rounded-full px-4 py-2.5 text-sm font-semibold transition ${
          on ? "bg-alive-navy text-white" : "bg-[#edf0f4] text-[#636981] hover:bg-[#e3e7ef]"}">${label} <span class="ml-0.5 ${on ? "text-white/70" : "text-[#9da2ad]"}">${n}</span></button>`;
      }).join("");
    }

    function card(c) {
      const [label, cls] = badges[c.status];
      const chip = tab === "stamp"
        ? `<svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>${esc(c.milestone).toUpperCase()}`
        : `🎁 ${esc(c.prize || "Scratch prize").toUpperCase()}`;
      const times = `Claimed: ${fmt(c.claimedAt)}${c.status === "redeemed" && c.redeemedAt ? ` • Redeemed: ${fmt(c.redeemedAt)}` : ""}`;

      let foot;
      if (c.status === "pending" && declining.has(String(c.id))) {
        foot = `<div class="mt-4 rounded-2xl bg-[#fde8ea] p-3.5">
          <p class="text-sm font-semibold text-[#c0262d]">Decline this reward for ${esc(c.name)}?</p>
          <div class="mt-3 grid grid-cols-2 gap-3">
            <button type="button" data-keep="${c.id}" class="h-11 rounded-[14px] border border-black/10 bg-white text-sm font-semibold text-[#23283c]">Keep</button>
            <button type="button" data-decline-yes="${c.id}" class="h-11 rounded-[14px] bg-[#d92d3a] text-sm font-extrabold text-white">Decline</button>
          </div></div>`;
      } else if (c.status === "pending") {
        foot = `<div class="mt-4 flex items-center justify-between gap-3">
          <span class="text-[13px] text-[#9a9eab]">Claimed: ${fmt(c.claimedAt)}</span>
          <div class="flex items-center gap-2">
            <button type="button" data-decline="${c.id}" class="rounded-full px-4 py-3 text-[15px] font-bold text-[#d92d3a] transition hover:bg-[#fde8ea]">Decline</button>
            <button type="button" data-accept="${c.id}" class="rounded-full bg-[#12b45c] px-6 py-3 text-[15px] font-extrabold text-white shadow-md shadow-[#12b45c]/25 transition hover:-translate-y-0.5">Accept</button>
          </div></div>`;
      } else {
        foot = `<p class="mt-4 text-[13px] leading-relaxed text-[#9a9eab]">${times}</p>`;
      }

      return `<article class="rounded-[26px] border border-black/[.07] bg-white/[.92] p-4 shadow-alive">
        <div class="flex items-start gap-3">
          <span class="flex h-[60px] w-[60px] shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-alive-purple/10 to-alive-cyan/15 text-alive-purple">
            <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 8 8 12 8zm0 0s2-5 4.5-3.5S16 8 12 8z"/></svg>
          </span>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <h3 class="truncate text-lg font-extrabold tracking-[-0.03em] text-alive-navy">${esc(c.name)}</h3>
                <a href="tel:+${esc(c.phone)}" class="mt-0.5 flex items-center gap-1.5 text-sm text-[#636981]">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>${esc(c.phone)}</a>
              </div>
              <span class="shrink-0 rounded-full px-3 py-2 text-[11px] font-extrabold tracking-wide ${cls}">${label}</span>
            </div>
            <span class="mt-2 inline-flex items-center gap-1 rounded-lg bg-alive-purple/10 px-2.5 py-1 text-[11px] font-extrabold tracking-wide text-alive-purple">${chip}</span>
          </div>
        </div>
        <p class="mt-3 text-base font-bold text-alive-navy">${esc(c.reward)}</p>
        ${foot}
      </article>`;
    }

    function renderList() {
      const q = $("search").value.trim().toLowerCase();
      const rank = { pending: 0, redeemed: 1, declined: 2 };
      const rows = claims()
        .filter((c) => (statusFilter === "all" || c.status === statusFilter) &&
          (!q || c.name.toLowerCase().includes(q) || c.phone.includes(q)))
        .sort((a, b) => (a.status === "pending") !== (b.status === "pending")
          ? rank[a.status] - rank[b.status]
          : b.claimedAt.localeCompare(a.claimedAt));

      if (!rows.length) {
        const msg = q || statusFilter !== "all" ? "No claims match your search."
          : tab === "stamp" ? "No stamp reward claims yet." : "No pending scratch claims.";
        $("list").innerHTML = `<div class="flex flex-col items-center rounded-[26px] border border-black/[.05] bg-white/[.92] px-6 py-14 text-center shadow-alive">
          <svg class="h-14 w-14 text-[#d3d6df]" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 8 8 12 8zm0 0s2-5 4.5-3.5S16 8 12 8z"/></svg>
          <p class="mt-4 text-base font-bold text-[#636981]">${msg}</p></div>`;
        return;
      }
      $("list").innerHTML = rows.map(card).join("");
    }

    function render() { renderTabs(); renderChips(); renderList(); }

    /* ---------------------------------
       EVENTS
    --------------------------------- */
    document.querySelectorAll(".tab-btn").forEach((b) => b.addEventListener("click", () => {
      tab = b.dataset.tab; statusFilter = "all"; render();
    }));
    $("chips").addEventListener("click", (e) => {
      const b = e.target.closest("[data-chip]");
      if (b) { statusFilter = b.dataset.chip; renderChips(); renderList(); }
    });
    $("search").addEventListener("input", renderList);

    // $("list").addEventListener("click", (e) => {
    //   const t = e.target.closest("[data-accept],[data-decline],[data-keep],[data-decline-yes]");
    //   if (!t) return;
    //   const d = t.dataset;
    //   const find = (id) => claims().find((c) => c.id === id);

    //   if (d.accept) {
    //     // DEMO: call your approve API here
        
    //     const c = find(d.accept);
    //     c.status = "redeemed"; c.redeemedAt = new Date().toISOString();
    //     showToast(`Reward accepted for ${c.name}.`);
    //   } else if (d.decline) declining.add(d.decline);
    //   else if (d.keep) declining.delete(d.keep);
    //   else if (d.declineYes) {
    //     // DEMO: call your decline API here
    //     const c = find(d.declineYes);
    //     c.status = "declined"; declining.delete(c.id);
    //     showToast(`Reward declined for ${c.name}.`);
    //   }
    //   renderChips(); renderList();
    // });

    $("list").addEventListener("click", async (e) => {
      

    const t = e.target.closest("[data-accept],[data-decline],[data-keep],[data-decline-yes]");
    if (!t) return;

    const d = t.dataset;
    const find = (id) => claims().find(c => c.id == id);
    console.log("Set:", declining);
console.log("Has string:", declining.has(String(d.decline)));
console.log("Has number:", declining.has(Number(d.decline)));

    // ---------------- APPROVE ----------------
    if (d.accept) {

        const c = find(d.accept);

        try {

            const response = await fetch(`/loyalty/accept-claim/${c.id}`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "Content-Type": "application/json"
                }
            });

            const result = await response.json();

            if (result.success) {

                c.status = "redeemed";
                c.redeemedAt = new Date().toISOString();

                showToast(`Reward accepted for ${c.name}.`);

            } else {

                alert(result.message);
                return;

            }

        } catch (err) {

            console.error(err);
            alert("Unable to approve reward.");
            return;

        }

    }

    // ---------------- SHOW DECLINE ----------------
    else if (d.decline) {
      console.log("Before:", declining);

    declining.add(String(d.decline));

    console.log("After:", declining);

    renderList();

        // declining.add(d.decline);

    }

    // ---------------- CANCEL DECLINE ----------------
    else if (d.keep) {

        declining.delete(d.keep);

    }

    // ---------------- FINAL DECLINE ----------------
    else if (d.declineYes) {

        const c = find(d.declineYes);

        try {

            const response = await fetch(`/loyalty/reject-claim/${c.id}`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "Content-Type": "application/json"
                }
            });

            const result = await response.json();

            if (result.success) {

                c.status = "declined";
                declining.delete(c.id);

                showToast(`Reward declined for ${c.name}.`);

            } else {

                alert(result.message);
                return;

            }

        } catch (err) {

            console.error(err);
            alert("Unable to decline reward.");
            return;

        }

    }

    renderChips();
    renderList();

});

    $("upgradeBtn").addEventListener("click", () => showToast("Demo: opening upgrade plans."));
    $("profileBtn").addEventListener("click", () => showToast("Demo: open profile."));
    document.querySelectorAll("[data-soon]").forEach((b) =>
      b.addEventListener("click", () => showToast(`Demo: ${b.dataset.soon} page.`)));

    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.remove("translate-y-32", "opacity-0");
      t.classList.add("translate-y-0", "opacity-100");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        t.classList.remove("translate-y-0", "opacity-100");
        t.classList.add("translate-y-32", "opacity-0");
      }, 3000);
    }

    render();
  </script>
</body>
</html>
