<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b3d" />
  <title>AliveFrame — Welcome</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ["Inter", "sans-serif"] },
          colors: {
            alive: { navy: "#070b3d", navy2: "#0b1154", blue: "#237dff", cyan: "#19d5e8", purple: "#823cff", pink: "#d936ff" },
            ink: "#0b1234", muted: "#636981", faint: "#747887",
          },
          boxShadow: { alive: "0 30px 90px rgba(7, 13, 65, .15)" },
        },
      },
    };
  </script>
  <style>
    :root { box-sizing: border-box; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f6f8ff] font-inter text-ink">
  <div aria-hidden="true" class="pointer-events-none fixed -right-40 -top-40 h-[420px] w-[420px] rounded-full bg-[#237dff]/20 blur-3xl"></div>

  <div class="relative mx-auto w-full max-w-[480px] pb-[calc(2rem+env(safe-area-inset-bottom))]">

    <!-- HEADER -->
    <header class="relative overflow-hidden rounded-b-[34px] bg-gradient-to-br from-alive-navy via-alive-navy2 to-[#2a1a8f] px-6 pb-20 pt-[calc(3rem+env(safe-area-inset-top))] text-center text-white shadow-alive">
      <span aria-hidden="true" class="absolute -bottom-12 -right-8 h-44 w-44 rounded-full bg-alive-pink/25"></span>
      <span aria-hidden="true" class="absolute right-10 top-10 h-12 w-12 rounded-full bg-alive-blue/50"></span>
      <span aria-hidden="true" class="relative mx-auto flex h-16 w-16 items-center justify-center rounded-2xl border border-white/20 bg-white/10">
        <svg class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.500 4.500 9 8 12 8zM12 8s2-5 4.500-3.500S15 8 12 8z"/></svg>
      </span>
      <h1 class="relative mt-5 text-3xl font-extrabold tracking-[-0.04em]">Welcome! <span aria-hidden="true">👋</span></h1>
      <p class="relative mt-2 text-[15px] font-medium text-white/75">Please tell us your name to get started.</p>
    </header>

    <main class="relative z-10 -mt-10 px-4">
      <form id="nameForm" novalidate class="rounded-[24px] border border-black/[.05] bg-white p-5 shadow-alive" method="POST">
        {% csrf_token %}
        <label for="name" class="block text-sm font-extrabold tracking-[-0.01em] text-alive-navy">Your name</label>
        <input
          id="name" name="name" type="text" autocomplete="name" autocapitalize="words" maxlength="60"
          placeholder="e.g. John Doe" aria-describedby="nameError"
          class="mt-2 h-14 w-full rounded-2xl border border-transparent bg-[#f1ecff]/60 px-4 text-base font-medium text-ink placeholder:text-faint/70 transition focus:border-[#5131dc]/40 focus:bg-white focus:outline-none focus:ring-4 focus:ring-[#5131dc]/15 aria-[invalid=true]:border-red-400"
        />
        <p id="nameError" role="alert" class="mt-2 hidden text-sm font-semibold text-red-600">Enter your name to continue.</p>

        <button type="submit"
          class="mt-4 inline-flex h-14 w-full items-center justify-center rounded-2xl bg-gradient-to-r from-[#5131dc] to-[#0f9eea] text-base font-extrabold text-white shadow-lg shadow-[#4e39d6]/30 transition hover:brightness-110 active:scale-[.99] focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-[#5a40e6]/40">
          Continue
        </button>
      </form>
    </main>
  </div>

</body>
</html>
