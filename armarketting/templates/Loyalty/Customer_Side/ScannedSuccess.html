<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f8ff" />
<title>AliveFrame — Stamp Collected</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  /* AliveFrame theme tokens (same values as the scan page) */
  --bg:#f6f8ff; --card:#fff; --ink:#0b1234; --muted:#636981; --faint:#747887; --line:#e3e7f3;
  --navy:#070b3d; --indigo:#5131dc; --sky:#0f9eea; --blue:#237dff; --cyan:#19d5e8; --purple:#823cff; --pink:#d936ff;
  --gold:#ffc400; --gold2:#ffa000; --ok:#22c55e;
  --grad:linear-gradient(135deg,var(--indigo),var(--sky));
  --tint:rgba(81,49,220,.1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b3d;--card:#0e1559;--ink:#f2f4ff;--muted:#a9b0d6;--faint:#8e96c4;--line:#222b78;--tint:rgba(15,158,234,.18)}}
:root[data-theme="dark"]{--bg:#070b3d;--card:#0e1559;--ink:#f2f4ff;--muted:#a9b0d6;--faint:#8e96c4;--line:#222b78;--tint:rgba(15,158,234,.18)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity .4s}
.stage.on{opacity:1;visibility:visible}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* ---- 1. Unlocking ---- */
.tile{position:relative;width:150px;height:150px;display:grid;place-items:center;animation:float 1.6s ease-in-out infinite}
.tile::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:rgba(255,196,0,.22);animation:breathe 1.6s ease-in-out infinite}
.tile .sq{position:relative;width:110px;height:110px;border-radius:30px;background:linear-gradient(135deg,var(--gold2),var(--gold));border:4px solid #fff;box-shadow:0 20px 40px rgba(255,160,0,.35);display:grid;place-items:center;transform:rotate(-8deg);animation:wobble 1.2s ease-in-out infinite}
.tile svg.gift{width:54px;height:54px;color:#fff}
.spk{position:absolute;color:var(--gold2);animation:twinkle 1.2s ease-in-out infinite}
h1,h2{margin:0}
.t1{margin-top:44px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{margin:10px auto 0;max-width:280px;font-size:15px;line-height:1.5;color:var(--muted)}
.dots span{display:inline-block;animation:dot 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}

/* ---- 2. Waiting for approval ---- */
.toast{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:var(--card);box-shadow:0 10px 30px rgba(7,13,65,.18);font-size:15px;font-weight:500;white-space:nowrap;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.stage.on .toast{transform:translate(-50%,0)}
.toast i{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.toast svg{width:13px;height:13px;color:#fff}
.pulse{position:relative;width:300px;height:300px;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;background:var(--tint);opacity:0;animation:ring 2s ease-out infinite}
.ring:nth-child(1){width:300px;height:300px}.ring:nth-child(2){width:210px;height:210px;animation-delay:.5s}.ring:nth-child(3){width:130px;height:130px;animation-delay:1s}

/* ---- Stamp (shared) ---- */
.stamp{position:relative;width:216px;height:216px;border-radius:50%;background:var(--grad);box-shadow:0 0 60px rgba(81,49,220,.45);display:grid;place-items:center}
.stamp::before{content:"";position:absolute;inset:10px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.stamp svg.gift{width:84px;height:84px;color:#fff;transform:scale(0)}
.badge{position:absolute;right:-8px;bottom:-4px;width:78px;height:78px;border-radius:50%;background:#fff;color:var(--indigo);font-size:36px;font-weight:800;display:grid;place-items:center;box-shadow:0 8px 24px rgba(7,13,65,.25)}
.stamp.small{width:160px;height:160px}.stamp.small .badge{width:60px;height:60px;font-size:28px}
.slam{animation:slam .7s cubic-bezier(.2,1.5,.4,1) both}
.shine{position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--cyan);opacity:0}
.celebrate .shine{animation:shine 1.1s ease-out both}
.celebrate .stamp{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both,glow 2.4s ease-in-out .8s infinite}
.celebrate .stamp svg.gift{animation:giftIn .7s cubic-bezier(.2,1.8,.4,1) .35s both}
.celebrate .badge{animation:badge .6s cubic-bezier(.2,2,.4,1) .7s both}

/* ---- 3. Success ---- */
.t3{margin-top:34px;font-size:34px;font-weight:800;letter-spacing:-.04em}
.biz{margin-top:8px;font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.rise{opacity:0;transform:translateY(18px)}
.celebrate .rise{animation:rise .6s ease-out forwards}
.card{width:100%;max-width:360px;margin-top:28px;padding:18px 20px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left}
.row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--faint);letter-spacing:.08em}
.row b{color:var(--ink);font-size:16px;letter-spacing:0}
.bar{height:12px;margin-top:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width 1.2s cubic-bezier(.3,.8,.3,1) 1.3s;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:sweep 1.6s ease-in-out 2.5s infinite}
.earned{margin-top:14px;text-align:center;font-weight:700;color:var(--indigo);font-size:15px;opacity:0;transition:opacity .5s 2.5s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .earned{color:var(--cyan)}}
.celebrate .earned{opacity:1}
.xp{margin-top:20px;display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:var(--tint);color:var(--indigo);font-weight:800;font-size:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xp{color:var(--cyan)}}
.xp svg{width:20px;height:20px}
.celebrate .xp{animation:rise .6s ease-out 2.2s forwards,bump .5s ease-out 3.4s}
.actions{width:100%;max-width:360px;margin-top:26px;display:grid;gap:10px}
.btn{height:54px;border-radius:18px;border:0;font:800 16px Inter,sans-serif;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 12px 24px rgba(78,57,214,.25)}
.btn.s{background:transparent;color:var(--muted);font-weight:600;height:44px}
.btn:focus-visible{outline:4px solid rgba(90,64,230,.4);outline-offset:2px}
.celebrate .actions{animation:rise .6s ease-out 3.2s forwards;opacity:0}

@keyframes float{50%{transform:translateY(-12px)}}
@keyframes breathe{50%{transform:scale(1.12);opacity:.6}}
@keyframes wobble{50%{transform:rotate(6deg) scale(1.05)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes dot{50%{opacity:.2}}
@keyframes ring{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes slam{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 90px rgba(15,158,234,.65)}}
@keyframes shine{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.9)}}
@keyframes giftIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes badge{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.15)}}
@keyframes sweep{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zM12 8s2-5 4.5-3.5S15 8 12 8z"/></g></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8L10 3z"/><path d="M18 3v4M16 5h4"/></g></symbol>
</svg>

<!-- 1 · Unlocking -->
<section class="stage on" id="s1" aria-live="polite">
  <div class="tile">
    <div class="sq"><svg class="gift"><use href="#gift"/></svg></div>
    <svg class="spk" style="top:6px;right:-6px;width:34px;height:34px"><use href="#spark"/></svg>
    <svg class="spk" style="bottom:2px;left:-8px;width:26px;height:26px;animation-delay:.5s"><use href="#spark"/></svg>
  </div>
  <h1 class="t1">Unlocking reward<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
  <p class="sub">Hold tight! We're adding your stamp securely.</p>
</section>

<!-- 2 · Waiting for approval -->
<section class="stage" id="s2" aria-live="polite">
  <div class="toast" role="status"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Waiting for restaurant approval</div>
  <div class="pulse">
    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <div class="stamp small" id="stamp2"><span class="badge" id="n2">1</span></div>
  </div>
</section>

<!-- 3 · Success -->
<section class="stage" id="s3">
  <div style="position:relative">
    <span class="shine"></span>
    <div class="stamp"><svg class="gift"><use href="#gift"/></svg><span class="badge" id="n3">1</span></div>
  </div>
  <h2 class="t3 rise" style="animation-delay:.9s">Stamp collected! 🎉</h2>
  <p class="biz rise" style="animation-delay:1.05s" id="biz">At Aryan Restaurant</p>
  <div class="card rise" style="animation-delay:1.2s">
    <div class="row"><span>PROGRESS</span><b id="prog">1/1</b></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"><i id="fill"></i></div>
    <div class="earned" id="earned">🎁 You've earned a reward!</div>
  </div>
  <div class="xp"><svg><use href="#spark"/></svg><span id="xp">+0 XP</span></div>
  <div class="actions">
    <a class="btn p" onclick="window.location.href ='/loyalty/customer-rewards/{{business_hash_id}}'">View my reward</a>
    <a class="btn s" onclick="window.location.href ='/loyalty/customer-dashboard/{{business_hash_id}}'">Back to home</a>
    <button class="btn s" id="replay" type="button">Replay animation</button>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
const have=Math.max(1,parseInt(q.get("stamp")||"1",10)||1), total=Math.max(1,parseInt(q.get("total")||"1",10)||1), XP=parseInt(q.get("xp")||"10",10)||10;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const name=(q.get("name")||"Aryan Restaurant").slice(0,60);
$("biz").textContent="At "+name;
$("n2").textContent=$("n3").textContent=have;
$("prog").textContent=have+"/"+total;
$("earned").style.display=have>=total?"":"none";

/* Haptics: Android Chrome supports it; iOS Safari ignores it silently */
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* Confetti, drawn in theme colours */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function size(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener("resize",size);size();
function burst(x,y,n,spread){
  const cols=["#5131dc","#0f9eea","#19d5e8","#823cff","#d936ff","#ffc400","#237dff"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(Math.random()*.6+.4)*spread;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spread*.5,w:Math.random()*8+5,h:Math.random()*5+3,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1})}
  if(!raf)loop()}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.007;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

function countXP(){const t0=performance.now(),d=900;(function f(t){const k=Math.min((t-t0)/d,1);$("xp").textContent="+"+Math.round(XP*k)+" XP";if(k<1)requestAnimationFrame(f)})(t0)}

const show=id=>["s1","s2","s3"].forEach(s=>$(s).classList.toggle("on",s===id));
let timers=[];const at=(ms,fn)=>timers.push(setTimeout(fn,ms));

function play(){
  timers.forEach(clearTimeout);timers=[];parts=[];
  document.body.classList.remove("celebrate");
  $("fill").style.width="0";$("xp").textContent="+0 XP";
  $("stamp2").classList.remove("slam");
  show("s1");buzz(15);

  at(1800,()=>{show("s2");$("stamp2").classList.add("slam");buzz([30,90,30])});
  at(2400,()=>buzz(20));           /* soft "heartbeat" while waiting */
  at(3000,()=>buzz(20));

  at(3900,()=>{
    show("s3");document.body.classList.add("celebrate");
    $("fill").style.width=Math.min(have/total,1)*100+"%";
    buzz([60,40,60,40,140]);       /* the "you did it" buzz */
    if(!reduce){
      burst(innerWidth/2,innerHeight*.38,110,13);
      at(350,()=>{burst(innerWidth*.2,innerHeight*.45,50,10);burst(innerWidth*.8,innerHeight*.45,50,10)});
      at(1300,()=>burst(innerWidth/2,innerHeight*.3,60,11));
    }
    at(2200,countXP);
    at(2300,()=>buzz(35));         /* XP lands */
    at(3000,()=>buzz([25,50,25]));
  });
}
$("replay").addEventListener("click",play);
play();
</script>
</body>
</html>
