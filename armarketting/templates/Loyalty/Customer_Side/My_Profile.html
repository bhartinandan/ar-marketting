<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b3d">
<title>My Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#070b3d; --navy2:#0b1154; --navy3:#2a1a8f; --blue:#237dff; --purple:#823cff;
  --ink:#0b1234; --muted:#636981; --faint:#747887; --bg:#f6f8ff; --accent:#5131dc; --accent2:#0f9eea; --soft:#f1ecff;
  --shadow:0 30px 90px rgba(7,13,65,.15); color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.glow{position:fixed;right:-160px;top:-160px;width:420px;height:420px;border-radius:50%;background:rgba(35,125,255,.2);filter:blur(64px);pointer-events:none}
.app{position:relative;max-width:480px;margin:0 auto;padding-bottom:calc(8rem + env(safe-area-inset-bottom,0px))}
header{text-align:center;background:linear-gradient(135deg,var(--navy),var(--navy2),var(--navy3));color:#fff;border-radius:0 0 34px 34px;padding:28px 16px 36px;box-shadow:var(--shadow)}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
.avatar{position:relative;width:112px;height:112px;margin:22px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.35);background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;overflow:hidden}
.avwrap{position:relative;width:112px;margin:0 auto}
.avatar svg{width:70px;height:70px;color:rgba(255,255,255,.9);margin-top:14px}
.edit{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.edit svg{width:15px;height:15px}
.name{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.name h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.04em}
.name button{border:0;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;padding:4px;display:grid}
.name svg{width:18px;height:18px}
.since{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:13px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.75);text-transform:uppercase}
.pill{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
main{position:relative;z-index:1;padding:20px 16px 0}
.card{background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:24px;box-shadow:0 1px 3px rgba(7,13,65,.08)}
.field{display:flex;align-items:center;gap:14px;padding:16px}
.field+.field{padding-top:4px}
.ico{flex:none;width:48px;height:48px;border-radius:16px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.field small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.field b{display:block;margin-top:3px;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.field b.unset{font-weight:600;font-style:italic;color:var(--faint)}
h3{margin:26px 0 10px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.row{display:flex;align-items:center;gap:16px;width:100%;border:0;background:transparent;font:inherit;text-align:left;padding:18px 16px;cursor:pointer;color:var(--ink);border-radius:24px}
.row+.row{border-top:1px solid #eef1fb;border-radius:0}
.row:first-child{border-radius:24px 24px 0 0}.row:last-child{border-radius:0 0 24px 24px}
.row .l{width:24px;height:24px;color:var(--muted);flex:none}
.row span{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.beta{margin-left:-6px;border-radius:8px;background:#eef1fb;padding:4px 10px;font-size:11px!important;font-weight:700!important;letter-spacing:.06em;color:var(--muted)!important}
.row .chev{margin-left:auto;width:20px;height:20px;color:#b6bacd}
.out{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:24px;border:0;border-radius:24px;background:#ef4444;color:#fff;font:800 18px Inter,sans-serif;letter-spacing:-.02em;padding:18px;cursor:pointer;box-shadow:0 10px 20px -6px rgba(239,68,68,.4)}
.out svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 16px calc(1rem + env(safe-area-inset-bottom,0px))}
.bar{position:relative;max-width:480px;margin:0 auto;height:84px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border:1px solid rgba(0,0,0,.05);border-radius:34px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.bar a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.025em;color:var(--faint);text-decoration:none;text-transform:uppercase}
.bar a.on{font-weight:700;color:var(--accent)}
.bar svg{width:28px;height:28px}
.scan{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 15px -3px rgba(78,57,214,.3)}
.scan svg{width:32px;height:32px}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.name input{width:min(240px,70vw);font:800 24px Inter,sans-serif;letter-spacing:-.04em;color:#fff;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:6px 12px;outline:none}
.name input:focus{border-color:#fff}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="app">
<header>
  <h1>My Profile</h1>
  <div class="avwrap">
    <div class="avatar"><img id="photo" alt="Profile photo" hidden><svg id="ph" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 22c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg></div>
    <input type="file" id="file" accept="image/*" hidden>
    <button class="edit" id="editPhoto" aria-label="Change photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
  <div class="name" id="nameBox"><h2 id="nm">{{profile.name}}</h2><input id="nmIn" type="text" maxlength="40" aria-label="Your name" hidden><button id="editName" aria-label="Edit name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button></div>
  <!-- <div class="since"><span class="pill">Member</span><span>Since May 2026</span></div> -->
</header>

<main>
  <section class="card" aria-label="Contact details">
    <div class="field"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg></span><div><small>Phone number</small><b>{{profile.contact}}</b></div></div>
    <div class="field"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span><div><small>{{profile.email}}</small><b class="unset">Not set</b></div></div>
  </section>

  <h3>App settings</h3>
  <section class="card" aria-label="App settings">
    <button class="row toast-btn"><svg class="l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg><span>Privacy &amp; Security</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="row toast-btn"><svg class="l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.6 2.6 0 115 .8c0 1.7-2.5 2-2.5 3.7M12 17.2h.01"/></svg><span>Help &amp; Support</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </section>

  <button class="out toast-btn" id="signOutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign Out</button>
</main>
</div>
<div class="toast" id="toast" role="status">Coming soon</div>
<nav aria-label="Main"><div class="bar">
  <a onclick="window.location.href ='/loyalty/customer-dashboard/{{ hash_id }}'"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z"/></svg>Home</a>
  <a onclick="window.location.href ='/loyalty/customer-explore/{{ hash_id }}'"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg>Explore</a>
  <span aria-hidden="true"></span>
  <a onclick="window.location.href ='/loyalty/customer-rewards/{{ hash_id }}'"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zM12 8s2-5 4.5-3.5S15 8 12 8z"/></svg>Rewards</a>
  <a onclick="window.location.href ='/loyalty/customer-profile/{{ hash_id }}'" class="on" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg>Profile</a>
  <button onclick="window.location.href ='/loyalty/customer-scanner/{{ hash_id }}'" class="scan" aria-label="Scan QR code"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2M8 12h8"/></svg></button>
</div></nav>
<script>
  const csrfToken = "{{ csrf_token }}";
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showPhoto(src){$("photo").src=src;$("photo").hidden=false;$("ph").style.display="none"}
const savedPhoto=get("profilePhoto"),savedName=get("profileName");
if(savedPhoto)showPhoto(savedPhoto);
if(savedName)$("nm").textContent=savedName;
$("editPhoto").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const S=320,c=document.createElement("canvas");c.width=c.height=S;
    const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    c.getContext("2d").drawImage(img,sx,sy,m,m,0,0,S,S);
    const d=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(url);
    showPhoto(d);set("profilePhoto",d);
  };
  img.src=url;
};
let editing=false;
function startEdit(){editing=true;$("nmIn").value=$("nm").textContent;$("nm").hidden=true;$("nmIn").hidden=false;$("nmIn").focus();$("nmIn").select()}
function endEdit(save){
  if(!editing)return;editing=false;
  const v=$("nmIn").value.trim();
  if(save&&v){$("nm").textContent=v;set("profileName",v)}
  $("nmIn").hidden=true;$("nm").hidden=false;
}
$("editName").onmousedown=e=>e.preventDefault();
$("editName").onclick=()=>editing?endEdit(true):startEdit();
$("nmIn").onkeydown=e=>{if(e.key==="Enter")endEdit(true);if(e.key==="Escape")endEdit(false)};
$("nmIn").onblur=()=>endEdit(true);
const t=document.getElementById("toast");let h;
document.querySelectorAll(".toast-btn").forEach(b=>b.onclick=()=>{t.classList.add("on");clearTimeout(h);h=setTimeout(()=>t.classList.remove("on"),1400)});

document.getElementById("signOutBtn").addEventListener("click", function () {
  onclick="window.location.href ='/loyalty/logout'"

    if (!confirm("Are you sure you want to sign out?")) {
        return;
    }

    // Optional: clear locally stored profile data
    localStorage.removeItem("profilePhoto");
    localStorage.removeItem("profileName");

    // Redirect to Django logout URL
    window.location.href = "/loyalty/logout";
});
</script>
</body>
</html>
