<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b3d" />
  <title>AliveFrame — Business</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ["Inter", "sans-serif"] },
          colors: {
            alive: { navy: "#070b3d", navy2: "#0b1154", blue: "#237dff", cyan: "#19d5e8", purple: "#823cff", pink: "#d936ff" },
            ink: "#0b1234", muted: "#636981", faint: "#747887",
          },
          boxShadow: { alive: "0 30px 90px rgba(7, 13, 65, .15)" },
        },
      },
    };
  </script>
  <style>
    :root { box-sizing: border-box; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f6f8ff] font-inter text-ink">
  <div aria-hidden="true" class="pointer-events-none fixed -right-40 -top-40 h-[420px] w-[420px] rounded-full bg-[#237dff]/20 blur-3xl"></div>

  <div class="relative mx-auto w-full max-w-[480px] pb-[calc(8rem+env(safe-area-inset-bottom))]">

    <!-- HEADER -->
    <header class="rounded-b-[34px] bg-gradient-to-br from-alive-navy via-alive-navy2 to-[#2a1a8f] px-4 pb-16 pt-[calc(1.25rem+env(safe-area-inset-top))] text-white shadow-alive">
      <a href="customer-home.html" aria-label="Back to Home" class="flex h-9 w-9 items-center justify-center rounded-full bg-white/10 transition hover:bg-white/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div class="mt-4 flex items-center gap-4">
        <span id="logoBox" class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-full border-2 border-white/30 bg-white/10 text-2xl font-extrabold"></span>
        <h1 id="bizName" class="min-w-0 break-words text-2xl font-extrabold leading-tight tracking-[-0.04em]"></h1>
      </div>
      <p id="progressText" class="mt-6 text-[40px] font-extrabold leading-none tracking-[-0.045em]"></p>
    </header>

    <main id="content" class="relative z-10 -mt-10 space-y-4 px-4"></main>
  </div>

  <!-- BOTTOM NAV -->
  <nav aria-label="Main" class="fixed inset-x-0 bottom-0 z-40 px-4 pb-[calc(1rem+env(safe-area-inset-bottom))]">
    <div class="relative mx-auto grid h-[84px] max-w-[480px] grid-cols-5 items-center rounded-[34px] border border-black/[.05] bg-white/95 shadow-alive backdrop-blur">
      <a onclick="window.location.href ='/loyalty/customer-dashboard/{{ hash_id }}'" class="flex flex-col items-center gap-1 text-[11px] font-semibold tracking-wide text-faint">
        <svg aria-hidden="true" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z"/></svg>HOME
      </a>
      <a onclick="window.location.href ='/loyalty/customer-explore/{{ hash_id }}'" class="flex flex-col items-center gap-1 text-[11px] font-semibold tracking-wide text-faint">
        <svg aria-hidden="true" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg>EXPLORE
      </a>
      <span aria-hidden="true"></span>
      <a onclick="window.location.href ='/loyalty/customer-rewards/{{ hash_id }}'" class="flex flex-col items-center gap-1 text-[11px] font-semibold tracking-wide text-faint">
        <svg aria-hidden="true" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zM12 8s2-5 4.5-3.5S15 8 12 8z"/></svg>REWARDS
      </a>
      <a onclick="window.location.href ='/loyalty/customer-profile/{{ hash_id }}'" class="flex flex-col items-center gap-1 text-[11px] font-semibold tracking-wide text-faint">
        <svg aria-hidden="true" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg>PROFILE
      </a>
      <a onclick="window.location.href ='/loyalty/customer-scanner/{{ hash_id }}'" aria-label="Scan QR code" class="absolute left-1/2 top-0 flex h-[76px] w-[76px] -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-[#5131dc] to-[#0f9eea] text-white shadow-lg shadow-[#4e39d6]/30 transition hover:scale-105 focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-[#5a40e6]/40">
        <svg aria-hidden="true" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2M8 12h8"/></svg>
      </a>
    </div>
  </nav>

  <script>
    /* DATA: replace with your API call, e.g. fetch(`/api/businesses/${id}`) */
    const csrfToken = "{{ csrf_token }}";
    const businesses = {
      "6ac60": {
        name: "{{ business_name }}",
        logo: null,
        pending: "{{customer_visit_history_unapproved}}", // stamps waiting for staff approval
        stamps: '{{ visit_count }}', // this customer's stamps at this business (2 = "Ready to claim" shows; use 1 to see "Collect 1 more")
        rewards: 
        JSON.parse('{{ rewards|safe }}'),
        // [
        //   { id: "r1", title: "After two Sattu one will be free", image: null, required: 2, claimed: false, expiryDays: 29 },
        //   { id: "r2", title: "After 5 visit", image: null, required: 1, claimed: true, expiryDays: 29 },
        //   { id: "r3", title: "After 8 stamps one dessert will be free", image: null, required: 8, claimed: false, expiryDays: 29 },
        // ],
        hours: { open: "{{open_at}}", close: "{{close_at}}" },
        phone: "{{contact}}",
        email: "{{email}}",
        address: "{{business_address}}",
        social: { instagram: "{{instagram}}", facebook: "{{facebook}}", youtube: "{{youtube}}", googleReview: "{{google_review}}" },
      },
    };
    

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
    const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

    const icons = {
      gift: '<svg aria-hidden="true" class="h-full w-full" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zM12 8s2-5 4.5-3.5S15 8 12 8z"/></svg>',
      clock: '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      phone: '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>',
      mail: '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
      pin: '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
      link: '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
      star: '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>',
      chevron: '<svg aria-hidden="true" class="h-5 w-5 shrink-0 text-faint" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
    };

    /* Hours: handles overnight ranges like 18:00 – 02:00 */
    const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const t12 = (t) => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`; };
    function openNow(h) {
      const now = new Date().getHours() * 60 + new Date().getMinutes(), o = mins(h.open), c = mins(h.close);
      return o < c ? now >= o && now < c : now >= o || now < c;
    }

    function rewardCard(r, stamps) {
      const ready = !r.claimed && stamps >= r.required;
      const status = r.claimed ? "Claimed" : ready ? "Ready to claim" : `Collect ${stamps >= r.required ? 0 : r.required - stamps} more`;
      const statusCls = r.claimed ? "font-medium text-faint" : ready ? "rounded-lg border border-[#bfe9d2] bg-[#e8f8ef] px-2.5 py-1 font-extrabold text-[#16a058]" : "font-medium text-muted";
      const img = r.image
        ? `<img src="${esc(r.image)}" alt="" class="h-full w-full object-contain" />`
        : `<span class="block h-9 w-9 text-[#5131dc]">${icons.gift}</span>`;
      /* CHANGED: green border highlight when the reward is ready to claim */
      return `<article class="flex items-center gap-4 rounded-[24px] border p-4 ${
        r.claimed ? "border-black/[.05] bg-white/60 opacity-70"
        : ready ? "border-[#16a058]/40 bg-white shadow-alive"
        : "border-black/[.05] bg-white shadow-alive"}">
        <span class="flex h-[72px] w-[72px] shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-[#f1ecff]">${img}</span>
        <div class="min-w-0 flex-1">
          <h3 class="break-words text-lg font-extrabold leading-tight tracking-[-0.03em] text-alive-navy">${esc(r.title)}</h3>
          <div class="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1">
            <span class="rounded-lg bg-[#f1ecff] px-2.5 py-1 text-xs font-extrabold text-[#5131dc]">${plural(r.required, "STAMP")}</span>
            <span class="flex items-center gap-1.5 text-sm ${statusCls}"><span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-current"></span>${status}</span>
          </div>
          ${r.expiryDays > 0 ? `<p class="mt-1.5 text-xs font-semibold text-muted">Expires in ${plural(r.expiryDays, "day")}</p>` : ""}
        </div>
      </article>`;
    }

    function stampTiles(stamps, goal) {
      const MAX = 8, shown = Math.min(goal, MAX);
      let html = "";
      for (let i = 0; i < shown; i++) {
        html += i < stamps
          ? `<span class="flex h-[76px] w-[76px] items-center justify-center rounded-[22px] bg-gradient-to-br from-[#5131dc] to-[#0f9eea] p-5 text-white shadow-md shadow-[#4e39d6]/20">${icons.gift}</span>`
          : `<span class="flex h-[76px] w-[76px] flex-col items-center justify-center gap-0.5 rounded-[22px] border-2 border-dashed border-[#5131dc]/40 bg-[#f1ecff] text-[#5131dc]/70"><span class="block h-6 w-6">${icons.gift}</span><span class="text-xs font-bold">${i + 1}</span></span>`;
      }
      if (goal > shown) html += `<span class="flex h-[76px] items-center rounded-[22px] bg-[#edf0f4] px-4 text-sm font-bold text-muted">+${goal - shown}</span>`;
      return html;
    }

    function infoRow({ icon, tint, title, sub, href, external }) {
      const inner = `<span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full ${tint}">${icon}</span>
        <span class="min-w-0 flex-1"><span class="block break-words text-lg font-semibold tracking-[-0.02em] text-alive-navy">${title}</span>${sub ? `<span class="block text-sm font-bold">${sub}</span>` : ""}</span>${href ? icons.chevron : ""}`;
      return href
        ? `<a href="${esc(href)}" ${external ? 'target="_blank" rel="noopener noreferrer"' : ""} class="flex items-center gap-4 p-5 transition hover:bg-[#f6f8ff] focus-visible:outline focus-visible:outline-2 focus-visible:outline-alive-purple">${inner}</a>`
        : `<div class="flex items-center gap-4 p-5">${inner}</div>`;
    }

    function render(b) {
      document.title = `${b.name} — AliveFrame`;
      $("bizName").textContent = b.name;
      $("logoBox").innerHTML = b.logo ? `<img src="${esc(b.logo)}" alt="" class="h-full w-full object-cover" />` : esc([...b.name.trim()][0]?.toUpperCase() || "A");

      const stamps = Math.max(0, b.stamps);
      const rewards = [...b.rewards].sort((a, c) => a.claimed - c.claimed || a.required - c.required);
      const next = rewards.find((r) => !r.claimed);
      const pending = Math.max(0, Number(b.pending) || 0);
      const pendingTag = pending ? `<span class="ml-2 align-middle text-lg font-bold tracking-normal text-[#ffb547]">+${pending} pending</span>` : "";
      $("progressText").innerHTML = (next ? `${Math.min(stamps, next.required)} of ${plural(next.required, "Stamp")}` : plural(stamps, "Stamp")) + pendingTag;

      /* Stamp card message */
      let msg;
      if (!next) msg = "You've claimed every reward here. Keep visiting for new ones.";
      else if (stamps >= next.required) {
        msg = `You've earned <b class="font-extrabold text-[#5131dc]">${esc(next.title)}</b>. Tap Claim Reward to redeem it.`;
      }
      else { const left = next.required - stamps; msg = `You're <b class="font-extrabold">${plural(left, "stamp")}</b> away from <b class="font-extrabold text-[#5131dc]">${esc(next.title)}</b>`; }

      /* Business info rows */
      const rows = [];
      if (b.hours?.open && b.hours?.close) {
        const open = openNow(b.hours);
        rows.push(infoRow({ icon: icons.clock, tint: "bg-[#eaf3ff] text-alive-blue", title: "Open today",
          sub: `<span class="${open ? "text-[#16a058]" : "text-[#d92d3a]"}">${open ? "OPEN NOW" : "CLOSED NOW"}</span> <span class="font-medium text-muted">· ${t12(b.hours.open)} – ${t12(b.hours.close)}</span>` }));
      }
      if (b.address) rows.push(infoRow({ icon: icons.pin, tint: "bg-[#e9fbf0] text-[#16a058]", title: esc(b.address), href: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.address)}`, external: true }));
      if (b.phone) rows.push(infoRow({ icon: icons.phone, tint: "bg-[#e9fbf0] text-[#16a058]", title: esc(b.phone), href: `tel:${b.phone.replace(/[^\d+]/g, "")}` }));
      if (b.email) rows.push(infoRow({ icon: icons.mail, tint: "bg-[#eaf3ff] text-alive-blue", title: esc(b.email), href: `mailto:${b.email}` }));
      [["instagram", "Instagram", "bg-[#fdeaff] text-alive-pink", icons.link], ["facebook", "Facebook", "bg-[#eaf3ff] text-alive-blue", icons.link], ["youtube", "YouTube", "bg-[#fde8ea] text-[#d92d3a]", icons.link], ["googleReview", "Rate us on Google", "bg-[#fff6d9] text-[#d19a00]", icons.star]]
        .forEach(([k, label, tint, icon]) => { const u = safeUrl(b.social?.[k]); if (u) rows.push(infoRow({ icon, tint, title: label, href: u, external: true })); });

      /* Pending staff approval (processing) note — kept in the stamp card */
      const pendingNote = pending
        ? `<div class="mt-5 flex items-start gap-3 rounded-2xl border border-[#f6e3b0] bg-[#fff8e6] p-4 text-[#b45309]"><span class="shrink-0 text-[#f59e0b]">${icons.clock}</span><p class="text-base font-medium leading-snug">${plural(pending, "stamp")} ${pending === 1 ? "is" : "are"} pending staff approval. ${pending === 1 ? "It" : "They"} will be added once approved.</p></div>`
        : "";

      /* One stamp card per unclaimed reward: ready ones get Claim Reward, others show ongoing progress */
      const stampCards = rewards.filter((r) => !r.claimed).map((r, idx) => {
        const have = Math.min(stamps, r.required), ready = stamps >= r.required, left = r.required - stamps;
        const text = ready
          ? `You've earned <b class="font-extrabold text-[#5131dc]">${esc(r.title)}</b>. Tap Claim Reward to redeem it.`
          : `You're <b class="font-extrabold">${plural(left, "stamp")}</b> away from <b class="font-extrabold text-[#5131dc]">${esc(r.title)}</b>`;
        const btn = ready
          ? `<button type="button" data-claim="${esc(r.id)}" class="mt-5 flex h-14 w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-[#16a058] to-[#22c55e] text-base font-extrabold text-white shadow-lg shadow-[#16a058]/30 transition hover:brightness-110 focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-[#16a058]/40"><span class="h-5 w-5">${icons.gift}</span>Claim Reward</button>`
          : "";
        return `<div class="rounded-[28px] border border-black/[.05] bg-white p-5 shadow-alive">
            <div class="flex flex-wrap gap-3" role="img" aria-label="${have} of ${r.required} stamps collected">${stampTiles(have, r.required)}</div>
            ${idx === 0 ? pendingNote : ""}
            <p class="mt-5 text-center text-base leading-relaxed text-muted">${text}</p>
            ${btn}
          </div>`;
      }).join("");

      $("content").innerHTML = `
        <section aria-label="Rewards" class="space-y-3">${rewards.map((r) => rewardCard(r, stamps)).join("") || '<p class="rounded-[24px] bg-white p-5 text-muted shadow-sm">No rewards available yet.</p>'}</section>
        ${next ? `<section aria-labelledby="stampTitle" class="space-y-4">
          <h2 id="stampTitle" class="mb-3 mt-6 text-sm font-semibold tracking-wider text-muted">STAMP CARD</h2>
          ${stampCards}</section>` : `<p class="rounded-[24px] bg-white p-5 text-center text-muted shadow-sm">${msg}</p>`}
        ${rows.length ? `<section aria-labelledby="infoTitle">
          <h2 id="infoTitle" class="mb-3 mt-6 text-sm font-semibold tracking-wider text-muted">BUSINESS INFO</h2>
          <div class="divide-y divide-black/[.05] overflow-hidden rounded-[28px] border border-black/[.05] bg-white shadow-alive">${rows.join("")}</div></section>` : ""}`;

      /* claim action */
    document.querySelectorAll("[data-claim]").forEach((btn) => {

    btn.onclick = async () => {

        const offerId = btn.dataset.claim;
        console.log("Claiming reward", offerId);

        btn.disabled = true;
        btn.innerHTML = "Requesting...";

        try {

            const response = await fetch(`/loyalty/reward-approval-request/{{customer_visit_hash_id}}`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                offer_id: "{{reward_id}}",
    })
            });

            const result = await response.json();

            if (result.success) {

                const reward = rewards.find(r => r.id == offerId);

                if (reward) {
                    reward.claimed = true;
                }

                alert("Reward request sent successfully.");

                render(b);

            } else {

                alert(result.message);

                btn.disabled = false;
                btn.innerHTML = `<span class="h-5 w-5">${icons.gift}</span>Claim Reward`;

            }

        } catch (err) {

            console.log(err);

            alert("Something went wrong.");

            btn.disabled = false;
            btn.innerHTML = `<span class="h-5 w-5">${icons.gift}</span>Claim Reward`;

        }

    };

});
    }

    function notFound() {
      $("bizName").textContent = "Business not found";
      $("progressText").textContent = "";
      $("content").innerHTML = '<div class="rounded-[24px] bg-white p-6 text-center shadow-alive"><p class="text-lg font-extrabold text-alive-navy">We couldn\'t find this business</p><p class="mt-1 text-muted">The link may be old or the business may have been removed.</p><a href="customer-home.html" class="mt-4 inline-flex h-12 items-center rounded-2xl bg-gradient-to-r from-[#5131dc] to-[#0f9eea] px-6 text-[15px] font-extrabold text-white">Back to Home</a></div>';
    }

    const id = new URLSearchParams(location.search).get("id");
    const biz = businesses[id] || (id === null ? businesses["6ac60"] : null); // demo: open the sample when no id is given
    biz ? render(biz) : notFound();
  </script>
</body>
</html>
