<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliveFrame</title>
    <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: black;
            font-family: 'Poppins', sans-serif;
   
        }

        /* Fullscreen Camera Feed */
        #camera-feed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Transparent Canvas for AR Video */
        #ar-canvas {
            position: absolute;
            width: 100% !important;
            height: auto;
            z-index: 999;
            pointer-events: auto;
            cursor: pointer;
            transform: translate(-50%, -50%) scale(1);
            left: 50%;
            top: 50%;
            touch-action: none;
            opacity: 0.9;
            border-radius: 0;
            
        }

        /* clickable button */
        #play-ar-btn {
    position: absolute;
    
    transform: translate(-50%,);
    padding: 12px 24px;
    font-size: 16px;
    color: #00ffe7;
    background: transparent;
    border: 2px solid #00ffe7;
    border-radius: 12px;
    cursor: pointer;
    z-index: 1000;
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif; /* Optional futuristic font */
    letter-spacing: 1.5px;
    transition: all 0.3s ease;
    box-shadow: 0 0 8px #00ffe7, 0 0 20px #00ffe7 inset;
    animation: pulse-glow 2s infinite;
}

#play-ar-btn:hover {
    background-color: rgba(0, 255, 231, 0.1);
    box-shadow: 0 0 12px #00ffe7, 0 0 30px #00ffe7 inset;
    transform: scale(1.05);
}

@keyframes pulse-glow {
    0%, 100% {
        box-shadow: 0 0 8px #00ffe7, 0 0 20px #00ffe7 inset;
    }
    50% {
        box-shadow: 0 0 16px #00ffe7, 0 0 40px #00ffe7 inset;
    }
}

        /* Button for Gyro Access */
        #gyro-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
        }

        #visitButton {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #00c6ff, #7f00ff);
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10100;
      width: 70%;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 198, 255, 0.4);
    }

    .footer {
      position: absolute;
      bottom: 0px;
      width: 100%;
      text-align: center;
      color: #aaa;
      font-size: 12px;
      font-weight: 400;
      z-index: 101;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 0;
    }

    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <button id="play-ar-btn">Click To Start</button>
    <a
    id="visitButton"
    href="{{media.redirect_url}}"
    target="_blank"
  >
    Visit Now <i class="fa-solid fa-arrow-right-long"></i>
  </a>
  <div class="footer">© AliveFrame. All rights reserved.</div>

    <script>

function adjustVideoBrightness(video, ctx, canvas) {
    const cameraFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let total = 0;
    for (let i = 0; i < cameraFrame.data.length; i += 4) {
        const r = cameraFrame.data[i];
        const g = cameraFrame.data[i + 1];
        const b = cameraFrame.data[i + 2];
        const avg = (r + g + b) / 3;
        total += avg;
    }
    const brightness = total / (cameraFrame.data.length / 4);
    const normalized = brightness / 255;

    // Apply brightness to AR video by scaling its alpha
    ctx.globalAlpha = Math.min(1, Math.max(0.5, normalized + 0.2)); // Keeps it visible
}
let lastRotateX = 0;
let lastRotateY = 0;

function handleOrientation(event) {
    if (!gyroEnabled) return;

    let targetY = event.alpha;
    let targetX = event.beta - 90;

    // Smooth transition
    lastRotateX += (targetX - lastRotateX) * 0.1;
    lastRotateY += (targetY - lastRotateY) * 0.1;

    canvas.style.transform = `
        translate(-50%, -50%) 
        scale(${scale}) 
        rotateX(${lastRotateX}deg) 
        rotateY(${lastRotateY}deg)
    `;
}



        async function startCamera() {
            try {
                const constraints = { video: { facingMode: { exact: "environment" } } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById("camera-feed").srcObject = stream;
            } catch (err) {
                console.warn("Back camera not available, using front...");
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById("camera-feed").srcObject = stream;
                } catch (error) {
                    console.error("Camera access denied:", error);
                }
            }
        }

        async function playARVideo() {
    const video = document.createElement("video");
    video.src = "{{media.overlap_video.url}}"; // Replace with your video URL
    video.loop = true;
    video.playsInline = true;
    video.crossOrigin = "anonymous";

    setupGreenScreen(video);
    return video;
}


        function setupGreenScreen(video) {
            const canvas = document.getElementById("ar-canvas");
            const ctx = canvas.getContext("2d");

            // Redirect when user taps/clicks on the AR video


            video.addEventListener("loadeddata", () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                function removeGreenScreen() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = frame.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let g = data[i + 1];
                        let r = data[i];
                        let b = data[i + 2];

                        if (g > 100 && g > r * 1.4 && g > b * 1.4) {
                            data[i + 3] = 0;
                        }
                    }

                    ctx.putImageData(frame, 0, 0);
                    requestAnimationFrame(removeGreenScreen);
                }

                removeGreenScreen();
            });
        }

        window.onload = async () => {
            startCamera();
            await playARVideo();
        };

        // Pinch & Scroll Zoom
        const canvas = document.getElementById("ar-canvas");
        let scale = 1;
        let pinchStartDistance = null;

       
        function pinchStart(e) {
            if (e.touches.length === 2) {
                pinchStartDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }

        function pinchMove(e) {
            if (e.touches.length === 2 && pinchStartDistance) {
                let pinchEndDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                let scaleChange = pinchEndDistance / pinchStartDistance;
                scale = Math.min(Math.max(scale * scaleChange, 0.5), 3);

                canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
                pinchStartDistance = pinchEndDistance;
            }
        }

        function pinchEnd() {
            pinchStartDistance = null;
        }

        function handleScroll(event) {
            scale = event.deltaY < 0 ? Math.min(scale + 0.1, 3) : Math.max(scale - 0.1, 0.5);
            canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        canvas.addEventListener("touchstart", pinchStart, { passive: false });
        document.addEventListener("touchmove", pinchMove, { passive: false });
        document.addEventListener("touchend", pinchEnd, { passive: false });
        document.addEventListener("wheel", handleScroll, { passive: false });

        // 360° Gyro Motion
        let gyroEnabled = false;
        function handleOrientation(event) {
            if (!gyroEnabled) return;
            let rotateY = event.alpha;
            let rotateX = event.beta - 90;
            canvas.style.transform = `translate(-50%, -50%) scale(${scale}) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        async function enableGyro() {
            if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === "granted") {
                    gyroEnabled = true;
                    window.addEventListener("deviceorientation", handleOrientation);
                    document.getElementById("gyro-btn").style.display = "none";
                } else {
                    alert("Permission denied.");
                }
            } else {
                gyroEnabled = true;
                window.addEventListener("deviceorientation", handleOrientation);
                document.getElementById("gyro-btn").style.display = "none";
            }
        }

        document.getElementById("play-ar-btn").addEventListener("click", async () => {
    const video = await playARVideo();
    video.muted = false;
    await video.play();
    document.getElementById("play-ar-btn").style.display = "none";
});


        document.getElementById("gyro-btn").addEventListener("click", enableGyro);
    </script>

</body>
</html>
