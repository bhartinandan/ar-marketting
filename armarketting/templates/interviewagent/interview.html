<!DOCTYPE html>
<html>
<head>
    <title>Realtime AI Video Interview Bot</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial;
            display: flex;
            height: 100vh;
        }

        .left {
            flex: 3;
            padding: 20px;
            background: #111827;
        }

        .right {
            flex: 1;
            background: #1f2937;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        video {
            width: 100%;
            height: 40%;
            background: black;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            background: #22c55e;
            color: white;
        }

        .chat-box {
            height: 250px;
            overflow-y: auto;
            background: #111827;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .ai { color: #22c55e; margin-bottom: 6px; }
        .user { color: #3b82f6; margin-bottom: 6px; }

        .recording {
            background: red !important;
        }
    </style>
</head>
<body>

<div class="left">
    <video id="userVideo" autoplay muted></video>
    <video id="aiVideo" autoplay loop 
        src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
</div>

<div class="right">

    <h3>Interview Setup</h3>

    <select id="field">
        <option>Data Analyst</option>
        <option>Frontend Developer</option>
        <option>Backend Developer</option>
        <option>AI Engineer</option>
    </select>

    <textarea id="resume" placeholder="Paste resume text here" rows="5" style="width:100%; margin-top:10px;"></textarea>

    <button onclick="startInterview()">Start Interview</button>

    <button id="micBtn" onclick="toggleRecording()">🎤 Speak</button>

    <h3>Conversation</h3>
    <div class="chat-box" id="chat"></div>

</div>

<script>

const API_KEY = "AIzaSyAEZUYezAPERqCpGqsAJdcltCTm2IQLZhg";
const MODEL = "gemini-2.0-flash";

let conversationHistory = [];
let recognition;
let isRecording = false;

/////////////////////////////////////////////////////
// 🎥 Start Webcam
/////////////////////////////////////////////////////

navigator.mediaDevices.getUserMedia({ video: true, audio: false })
.then(stream => {
    document.getElementById("userVideo").srcObject = stream;
});

/////////////////////////////////////////////////////
// 🎤 Speech Recognition
/////////////////////////////////////////////////////

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

recognition = new SpeechRecognition();
recognition.continuous = false;
recognition.lang = "en-US";

recognition.onresult = async function(event) {
    const transcript = event.results[0][0].transcript;
    addMessage("user", transcript);
    await processUserMessage(transcript);
};

recognition.onend = function() {
    isRecording = false;
    document.getElementById("micBtn").classList.remove("recording");
};

function toggleRecording() {
    if (!isRecording) {
        recognition.start();
        isRecording = true;
        document.getElementById("micBtn").classList.add("recording");
    } else {
        recognition.stop();
    }
}

/////////////////////////////////////////////////////
// 🧠 Gemini Call
/////////////////////////////////////////////////////

async function callGemini(prompt) {

    const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: conversationHistory.concat([
                    { role: "user", parts: [{ text: prompt }] }
                ])
            })
        }
    );

    const data = await response.json();

    if (!data.candidates) {
        return "API Error.";
    }

    const reply = data.candidates[0].content.parts[0].text;

    conversationHistory.push(
        { role: "user", parts: [{ text: prompt }] },
        { role: "model", parts: [{ text: reply }] }
    );

    return reply;
}

/////////////////////////////////////////////////////
// 🚀 Start Interview
/////////////////////////////////////////////////////

async function startInterview() {

    conversationHistory = [];

    const field = document.getElementById("field").value;
    const resume = document.getElementById("resume").value;

    const prompt = `
You are a strict HR interviewer.
Conduct a live professional interview for ${field}.
Ask one question at a time.
After candidate answers, ask next question.
Do not give long explanations.
Candidate Resume:
${resume}

Start interview.
`;

    const reply = await callGemini(prompt);
    addMessage("ai", reply);
    speak(reply);
}

/////////////////////////////////////////////////////
// 🔁 Handle Conversation
/////////////////////////////////////////////////////

async function processUserMessage(message) {

    const reply = await callGemini(message);
    addMessage("ai", reply);
    speak(reply);
}

/////////////////////////////////////////////////////
// 🔊 Text To Speech
/////////////////////////////////////////////////////

function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    speechSynthesis.speak(utterance);
}

/////////////////////////////////////////////////////
// 💬 Chat UI
/////////////////////////////////////////////////////

function addMessage(type, text) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
