<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <title>AliveFrame AR Experience</title>

  <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      height:100vh;
      font-family:'Poppins',sans-serif;
      background:#000;
    }

    a-scene{
      height:100vh;
      width:100vw;
    }

    .a-loader{
      display:none !important;
    }

    /* =========================================================
       MAIN OVERLAY
    ========================================================= */

    .grid{
      display:flex;
      justify-content:center;
      flex-direction:column;
      align-items:center;
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:82vh;
      z-index:100;
      pointer-events:none;
      padding:20px;
    }

    #targetOverlay{
      width:60vw;
      max-width:320px;
      border-radius:22px;
      opacity:.97;
      margin-bottom:24px;
      box-shadow:
        0 0 35px rgba(0,191,255,0.35),
        0 0 80px rgba(0,191,255,0.12);
      animation:softPulse 2.2s infinite ease-in-out;
    }

    .instruction-card{
      width:min(92%,420px);
      background:rgba(7,15,40,.72);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(14px);
      border-radius:26px;
      padding:24px 22px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      box-shadow:
        0 10px 40px rgba(0,0,0,.45),
        0 0 30px rgba(0,191,255,.12);
      animation:floatCard 3s ease-in-out infinite;
    }

    .instruction-icon{
      width:72px;
      height:72px;
      border-radius:50%;
      background:linear-gradient(135deg,#007bff,#00d4ff);
      display:flex;
      justify-content:center;
      align-items:center;
      box-shadow:
        0 0 22px rgba(0,191,255,.45),
        inset 0 0 12px rgba(255,255,255,.2);
    }

    .instruction-icon i{
      color:#fff;
      font-size:32px;
    }

    #messageBox{
      color:#fff;
      text-align:center;
      font-size:1.1rem;
      font-weight:600;
      line-height:1.6;
      letter-spacing:.2px;
    }

    #messageBox span{
      color:#00d4ff;
      font-weight:700;
    }

    #tapNotification{
      display:none;
      margin-top:6px;
      background:linear-gradient(90deg,#7f00ff,#00bfff);
      color:#fff;
      padding:14px 24px;
      border-radius:50px;
      font-size:1rem;
      font-weight:600;
      box-shadow:0 5px 22px rgba(0,191,255,.35);
      animation:pulseGlow 1.5s infinite;
    }

    #tapNotification i{
      margin-right:8px;
    }

    /* =========================================================
       VISIT BUTTON
    ========================================================= */

    #visitButton{
      position:absolute;
      bottom:90px;
      left:50%;
      transform:translateX(-50%);
      width:84%;
      max-width:420px;
      padding:18px 26px;
      border-radius:50px;
      border:none;
      background:linear-gradient(90deg,#7f00ff,#00bfff);
      color:#fff;
      font-size:17px;
      font-weight:600;
      display:none;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      box-shadow:0 6px 20px rgba(0,191,255,.35);
      z-index:101;
      transition:.25s ease;
    }

    #visitButton:hover{
      transform:translateX(-50%) scale(1.03);
      box-shadow:0 8px 28px rgba(0,191,255,.45);
    }

    #visitButton:active{
      transform:translateX(-50%) scale(.98);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .footer{
      position:absolute;
      bottom:0;
      width:100%;
      text-align:center;
      color:#b8b8b8;
      font-size:12px;
      padding:8px 0;
      background:rgba(0,0,0,.4);
      z-index:101;
      letter-spacing:.4px;
      backdrop-filter:blur(8px);
    }

    /* =========================================================
       CUSTOM LOADER
    ========================================================= */

    #customLoader{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:99999;
    }

    #customLoader img{
      width:200px;
      animation:logoPulse 1.6s infinite ease-in-out;
    }

    #customLoader p{
      margin-top:16px;
      color:#fff;
      font-weight:500;
      font-size:15px;
      letter-spacing:.4px;
    }

    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes softPulse{
      0%{
        transform:scale(1);
        opacity:.92;
      }
      50%{
        transform:scale(1.03);
        opacity:1;
      }
      100%{
        transform:scale(1);
        opacity:.92;
      }
    }

    @keyframes pulseGlow{
      0%{
        transform:scale(1);
        box-shadow:0 5px 18px rgba(0,191,255,.25);
      }
      50%{
        transform:scale(1.04);
        box-shadow:0 8px 28px rgba(0,191,255,.48);
      }
      100%{
        transform:scale(1);
        box-shadow:0 5px 18px rgba(0,191,255,.25);
      }
    }

    @keyframes floatCard{
      0%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-5px);
      }
      100%{
        transform:translateY(0px);
      }
    }

    @keyframes logoPulse{
      0%{
        transform:scale(1);
        opacity:.9;
      }
      50%{
        transform:scale(1.05);
        opacity:1;
      }
      100%{
        transform:scale(1);
        opacity:.9;
      }
    }

    @media(max-width:600px){

      #messageBox{
        font-size:1rem;
      }

      #tapNotification{
        font-size:.95rem;
        padding:12px 18px;
      }

      .instruction-card{
        padding:22px 18px;
      }

      #visitButton{
        font-size:15px;
        padding:16px 20px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================================================
       INSTRUCTION UI
  ========================================================= -->

  <div class="grid">

    <img id="targetOverlay"
         src="{{media.reference_img.url}}"
         alt="Target Overlay" />

    <div class="instruction-card">

      <div class="instruction-icon">
        <i class="fa-solid fa-camera"></i>
      </div>

      <div id="messageBox">
        Point your camera at the<br>
        <span>reference image</span>
      </div>

      <div id="tapNotification">
        <i class="fa-solid fa-hand-pointer"></i>
        Tap Anywhere to Start Experience
      </div>

    </div>

  </div>

  <!-- =========================================================
       VISIT BUTTON
  ========================================================= -->

  <a id="visitButton" href="#">
    <i class="fa-solid fa-arrow-up-right-from-square"></i>
    Explore More
  </a>

  <!-- =========================================================
       FOOTER
  ========================================================= -->

  <div class="footer">
    Powered by AliveFrame
  </div>

  <!-- =========================================================
       LOADER
  ========================================================= -->

  <div id="customLoader">

    <img src="{% static 'logo_name.png' %}"
         alt="AliveFrame Logo" />

    <p>Loading AR Experience...</p>

  </div>

  <!-- =========================================================
       AR SCENE
  ========================================================= -->

  <a-scene
    mindar-image="
      imageTargetSrc: {{media.target_img.url}};
      filterMinCF: 0.1;
      filterBeta: 0.7;
      warmupTolerance: 1;
      missTolerance: 5;
      maxTrack: 1;
      uiScanning: false;
    "

    color-space="sRGB"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>

      <video
        id="myVideo"
        src="{{media.overlap_video.url}}"
        preload="auto"
        playsinline
        loop
        crossorigin="anonymous">
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="targetAnchor"
      mindar-image-target="targetIndex: 0">

      <a-plane
        id="videoPlane"
        width="{{media.width}}"
        height="{{media.height}}"
        position="0 0 0"
        material="shader: flat; src: #myVideo;"
        visible="false">
      </a-plane>

    </a-entity>

  </a-scene>

  <!-- =========================================================
       SCRIPT
  ========================================================= -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const videoEl = document.getElementById("myVideo");
      const videoPlane = document.getElementById("videoPlane");
      const messageBox = document.getElementById("messageBox");
      const overlayImg = document.getElementById("targetOverlay");
      const tapNotification = document.getElementById("tapNotification");
      const targetAnchor = document.getElementById("targetAnchor");
      const visitBtn = document.getElementById("visitButton");
      const instructionCard = document.querySelector(".instruction-card");

      let videoPlaying = false;
      let targetFound = false;
      let tapHandledOnce = false;
      let buttonShownOnce = false;

      videoEl.load();

      /* =====================================================
         START VIDEO
      ===================================================== */

      const startVideo = () => {

        // Hide instruction UI
        overlayImg.style.display = "none";
        instructionCard.style.display = "none";

        videoEl.play().then(() => {

          videoPlaying = true;

          videoPlane.setAttribute("visible", "true");

          tapNotification.style.display = "none";

          if (!buttonShownOnce) {

            setTimeout(() => {

              visitBtn.style.display = "flex";
              buttonShownOnce = true;

            }, 5000);

          } else {

            visitBtn.style.display = "flex";

          }

        }).catch((err) => {

          console.error("Video error:", err);

          instructionCard.style.display = "flex";

          messageBox.innerHTML = `
            Tap again to<br>
            <span>allow video playback</span>
          `;

        });

      };

      /* =====================================================
         TARGET FOUND
      ===================================================== */

      targetAnchor.addEventListener("targetFound", () => {

        targetFound = true;

        if (!tapHandledOnce){

          tapNotification.style.display = "block";

        } else {

          startVideo();

        }

      });

      /* =====================================================
         TARGET LOST
      ===================================================== */

      targetAnchor.addEventListener("targetLost", () => {

        targetFound = false;

        videoPlane.setAttribute("visible", "false");

        if (videoPlaying){

          videoEl.pause();
          videoPlaying = false;

        }

        // Show instruction UI again
        overlayImg.style.display = "block";
        instructionCard.style.display = "flex";

        messageBox.innerHTML = `
          Point your camera at the<br>
          <span>reference image</span>
        `;

        tapNotification.style.display = "none";

        visitBtn.style.display =
          buttonShownOnce ? "flex" : "none";

      });

      /* =====================================================
         TAP TO START
      ===================================================== */

      document.body.addEventListener("click", () => {

        if (targetFound && !tapHandledOnce){

          tapHandledOnce = true;

          startVideo();

        }

      });

    });

    /* =========================================================
       HIDE LOADER
    ========================================================= */

    window.addEventListener("load", () => {

      document
        .querySelector("a-scene")
        .addEventListener("arReady", () => {

          const loader =
            document.getElementById("customLoader");

          if (loader){

            loader.style.display = "none";

          }

        });

    });

    /* =========================================================
       TAB VISIBILITY
    ========================================================= */

    document.addEventListener("visibilitychange", () => {

      const scene = document.querySelector("a-scene");

      if (!scene) return;

      const videoEl =
        document.getElementById("myVideo");

      if (document.hidden){

        if (scene.components["mindar-image"]){

          scene.components["mindar-image"].stop();

        }

        if (videoEl && !videoEl.paused){

          videoEl.pause();

        }

      } else {

        if (scene.components["mindar-image"]){

          scene.components["mindar-image"].start();

        }

      }

    });

  </script>

</body>
</html>
