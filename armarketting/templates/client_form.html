<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <link rel="shortcut icon" type="image/png" href="{% static 'aflogo.png' %}">
    <title>AliveFrame</title>
    <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet"> 
    
    <!-- Icon Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Stylesheets -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid position-relative d-flex p-0">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-dark position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->

        <!-- Sign Up Start -->
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-secondary rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <a onclick="window.location.href ='/'">
                                <h4 class="text-info"><i class="fa fa-user-edit me-2"></i>AliveFrame</h4>
                            </a>
                        </div>
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <p style="color: red;">{{error}}</p>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="name" name="name" placeholder="jhondoe" required>
                                <label for="name">Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="businessname" name="businessname" placeholder="jhondoe" required>
                                <label for="name">Business Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="businessindustry" name="businessindustry" placeholder="Business Industry" required>
                                <label for="businessindustry">Business Industry</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="businesswebsite" name="businesswebsite" placeholder="Business Website" required>
                                <label for="businesswebsite">Business Website</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="businesssize" name="businesssize" placeholder="Business Size" required>
                                <label for="businesswebsite">Business Size</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="businessdescription" name="businessdescription" placeholder="Business Description" required>
                                <label for="businessdescription">Business Description</label>
                            </div>  

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailid" name="emailid" placeholder="name@example.com">
                                <label for="emailid">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="address" name="address" placeholder="Address" required>
                                <label for="address">Address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="contact" name="contact" placeholder="Contact" required>
                                <label for="contact">Contact</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="pincode" name="pincode" placeholder="PinCode" required>
                                <label for="pincode">PinCode</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="city" name="city" placeholder="City" required>
                                <label for="city">City</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="state" name="state" placeholder="State" required>
                                <label for="state">State</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="country" name="country" placeholder="Country" required>
                                <label for="country">Country</label>
                            </div>
                            <button type="submit" class="btn btn-info py-3 w-100 mb-4">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Sign Up End -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/chart/chart.min.js' %}"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
    <script src="{% static 'lib/tempusdominus/js/moment.min.js' %}"></script>
    <script src="{% static 'lib/tempusdominus/js/moment-timezone.min.js' %}"></script>
    <script src="{% static 'lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js' %}"></script>

    <!-- Main JS -->
    <script src="{% static 'js/main.js' %}"></script>

    <!-- File Size Check Script -->
    <script>
        document.getElementById('video').addEventListener('change', function () {
            const file = this.files[0];
            const maxSize = 20 * 1024 * 1024; // 20 MB

            if (file && file.size > maxSize) {
                alert("File size must be less than 20 MB.");
                this.value = ""; // Clear file input
            }
        });
    </script>
</body>
</html>
