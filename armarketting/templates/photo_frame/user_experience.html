<!DOCTYPE html>
<html lang="en">
<head>
   {% load static %}  
  <meta charset="UTF-8" />
  <title>AliveFrame AR Experience</title>
  <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      height:100vh;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
    }
    #messageBox, #tapNotification {
      z-index: 100;
      background-color: rgb(7,15,96);
      text-align: center;
      color: #fff;
      padding: .3rem .6rem;
      border-radius: .2rem;
      margin-top: .2rem;
      font-size: 1.4rem;
      font-weight: 600;
    }
    #tapNotification { display: none; }
    #targetOverlay {
      width: 60vw;
      height: auto;
      opacity: 0.95;
      pointer-events: none;
      z-index: 99;
      box-shadow: 0 0 40px rgba(0, 198, 255, 0.25);
    }
    .grid{
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      height: 80vh;
      position: absolute;
      top: 0;
      width: 100%;
    }
    #visitButton {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #7f00ff;
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      display: none;
      opacity:.8;
      text-decoration: none;
      width: 80%;
      z-index: 101;
    }
    .footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      color: #aaa;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 0;
      z-index: 101;
    }
    a-scene { height: 100vh; width: 100vw; }
    .a-loader { display: none !important; }
    #customLoader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
  </style>
</head>
<body>
  
  <div class="grid">
    <img id="targetOverlay" src="{{media.reference_img.url}}" alt="Target Overlay" />
    <div id="tapNotification">Tap Anywhere to Start</div>
    <div id="messageBox">Place Camera On Image</div>
  </div>


  <div class="footer">Powered by Aliveframe</div>

  <div id="customLoader">
    <img src="{% static 'logo_name.png' %}" alt="AliveFrame Logo" style="width:194px; animation: pulse 1.4s infinite ease-in-out;" />
    <p style="margin-top: 0.8rem; font-weight: 500; color: white;">Loading AR Experience...</p>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: {{media.target_img.url}}; filterMinCF: 0.1; filterBeta: 0.7; warmupTolerance: 1; missTolerance: 5; maxTrack: 1; uiScanning: false;"
    color-space="sRGB"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <video id="myVideo" src="{{media.web_video.url}}" preload="auto" playsinline loop crossorigin="anonymous" loop></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0">
      <a-plane id="videoPlane" width="{{media.width}}" height="{{media.height}}" position="0 0 0"
        material="shader: flat; src: #myVideo;"
        visible="false"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const videoEl = document.getElementById("myVideo");
      const videoPlane = document.getElementById("videoPlane");
      const messageBox = document.getElementById("messageBox");
      const overlayImg = document.getElementById("targetOverlay");
      const tapNotification = document.getElementById("tapNotification");
      const targetAnchor = document.getElementById("targetAnchor");
      const visitBtn = document.getElementById("visitButton");

      let videoPlaying = false;
      let targetFound = false;
      let tapHandledOnce = false;
      let buttonShownOnce = false;

      // Preload video so first tap is instant
      videoEl.load();

      const startVideo = () => {
        videoEl.play().then(() => {
          videoPlaying = true;
          videoPlane.setAttribute("visible", "true");
          tapNotification.style.display = "none";
          if (!buttonShownOnce) {
            setTimeout(() => {
              visitBtn.style.display = "flex";
              buttonShownOnce = true;
            }, 5000);
          } else {
            visitBtn.style.display = "flex";
          }
        }).catch((err) => {
          console.error("Video error:", err);
          messageBox.textContent = "Tap again to allow video with sound.";
          messageBox.style.display = "block";
        });
      };

      targetAnchor.addEventListener("targetFound", () => {
        targetFound = true;
        messageBox.style.display = "none";
        overlayImg.style.display = "none";
        if (!tapHandledOnce) tapNotification.style.display = "block";
        else startVideo();
      });

      targetAnchor.addEventListener("targetLost", () => {
        videoPlane.setAttribute("visible", "false");
        if (videoPlaying) {
          videoEl.pause();
          videoPlaying = false;
        }
        overlayImg.style.display = "block";
        messageBox.textContent = "Place Camera On Poster";
        messageBox.style.display = "block";
        tapNotification.style.display = "none";
        visitBtn.style.display = buttonShownOnce ? "flex" : "none";
        targetFound = false;
      });

      document.body.addEventListener("click", () => {
        if (targetFound && !tapHandledOnce) {
          startVideo();
          tapHandledOnce = true;
        }
      });
    });

    window.addEventListener("load", () => {
      document.querySelector('a-scene').addEventListener("arReady", () => {
        const loader = document.getElementById("customLoader");
        if (loader) loader.style.display = "none";
      });
    });


    // restric


    document.addEventListener("contextmenu", e => e.preventDefault()); // Block right click

document.addEventListener("keydown", e => {
  if (e.ctrlKey && ["u","U","s","S","c","C","i","I","j","J"].includes(e.key)) {
    e.preventDefault(); // Block Ctrl+U, Ctrl+S, Ctrl+Shift+I, Ctrl+Shift+J
  }
  if (e.key === "F12") e.preventDefault(); // Block F12
});

(function() {
  const detector = setInterval(() => {
    const before = new Date();
    debugger; // slows execution if DevTools is open
    const after = new Date();
    if (after - before > 100) {
      document.body.innerHTML = "<h2 style='color:red;text-align:center;margin-top:40vh'>Access Restricted</h2>";
      clearInterval(detector);
    }
  }, 2000);
})();
  </script>
</body>
</html>
