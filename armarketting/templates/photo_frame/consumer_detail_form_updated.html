<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <title>AliveFrame — Album Upload</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Icons & Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #111218;
            color: #e6eef8;
            font-family: "Roboto", Arial, sans-serif;
        }

        .card-shell {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 22px;
        }

        .album-grid {
            display: none; /* shown when Album selected */
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 12px;
        }

        /* responsive: 3 columns on wider screens */
        @media (min-width: 992px) {
            .album-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1400px) {
            .album-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .album-item {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .album-item .title {
            font-size: 13px;
            color: #aeb8c9;
            font-weight: 600;
        }

        .preview-box {
            width: 100%;
            height: 140px;
            background: #0f1113;
            border: 1px dashed rgba(255,255,255,0.04);
            border-radius: 10px;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }

        .preview-box img,
        .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display:block;
        }

        .form-control, .form-select {
            background: #0f1113;
            color: #e6eef8;
            border: 1px solid rgba(255,255,255,0.04);
        }

        label.small-muted {
            font-size: 12px;
            color: #9aa6ba;
            margin-bottom: 6px;
            display:block;
        }

        .btn-submit {
            background: #0ea5a3;
            border: none;
            color: #062323;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card-shell">

                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h3 class="text-info mb-0"><i class="fa fa-photo-video me-2"></i>AliveFrame</h3>
                </div>

                <form id="uploadForm" enctype="multipart/form-data" autocomplete="off" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <select class="form-select" id="type" name="type">
                            <option value="">Select Type</option>
                            <option value="circle">Circle</option>
                            <option value="square">Square/Rectangular</option>
                            <option value="album">Album</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <input type="text" id="name" name="name" class="form-control" placeholder="Consumer Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="text" id="contact" name="contact" class="form-control" placeholder="Contact Number">
                    </div> 
                    <div class="mb-3">
                        <input type="email" id="emailid" name="emailid" class="form-control" placeholder="Email Address (Optional)">    
                    </div>

                    <!-- single upload section (default) -->
                    <div id="singleUploadSection" class="mb-3">
                        <div class="mb-3">
                            <label class="small-muted">Single Video</label>
                            <input type="file" class="form-control" id="singleVideo" accept="video/*">
                        </div>

                        <div class="mb-3">
                            <label class="small-muted">Single Image</label>
                            <input type="file" class="form-control" id="singleImage" accept="image/*">
                        </div>
                    </div>

                    <!-- album grid (generated by JS) -->
                    <div id="albumGrid" class="album-grid"></div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-submit w-100 py-2">Submit</button>
                    </div>
                </form>

            </div> <!-- card-shell -->
        </div>
    </div>
</div>

<script>
    // create 10 album boxes dynamically
    const albumGrid = document.getElementById('albumGrid');
    let html = '';
    for (let i = 1; i <= 10; i++) {
    html += `
    <div class="album-item">
        <div class="title">Item ${i}</div>

        <label class="small-muted">Image ${i}</label>
        <div class="preview-box" id="imgPreview${i}">
            <span style="color:#6b7280;font-size:13px">No Image</span>
        </div>
        <input type="file" class="form-control" id="albumImage${i}" name="albumImage${i}" accept="image/*">

        <label class="small-muted">Video ${i}</label>
        <div class="preview-box" id="videoPreview${i}">
            <span style="color:#6b7280;font-size:13px">No Video</span>
        </div>
        <input type="file" class="form-control" id="albumVideo${i}" name="albumVideo${i}" accept="video/*">
    </div>
    `;
    }
    albumGrid.innerHTML = html;

    // toggle album visibility
    const typeSelect = document.getElementById('type');
    const singleUpload = document.getElementById('singleUploadSection');

    typeSelect.addEventListener('change', () => {
        if (typeSelect.value === 'album') {
            albumGrid.style.display = 'grid';
            singleUpload.style.display = 'none';
        } else {
            albumGrid.style.display = 'none';
            singleUpload.style.display = 'block';
        }
    });

    // attach preview handlers for 10 boxes
    for (let i = 1; i <= 10; i++) {
        (function(i) {
            const imgInput = document.getElementById(`albumImage${i}`);
            const imgPreview = document.getElementById(`imgPreview${i}`);
            imgInput.addEventListener('change', () => {
                imgPreview.innerHTML = '';
                const f = imgInput.files && imgInput.files[0];
                if (!f) {
                    imgPreview.innerHTML = '<span style="color:#6b7280;font-size:13px">No Image</span>';
                    return;
                }
                const img = document.createElement('img');
                img.src = URL.createObjectURL(f);
                img.onload = () => URL.revokeObjectURL(img.src);
                imgPreview.appendChild(img);
            });

            const vidInput = document.getElementById(`albumVideo${i}`);
            const vidPreview = document.getElementById(`videoPreview${i}`);
            vidInput.addEventListener('change', () => {
                vidPreview.innerHTML = '';
                const f = vidInput.files && vidInput.files[0];
                if (!f) {
                    vidPreview.innerHTML = '<span style="color:#6b7280;font-size:13px">No Video</span>';
                    return;
                }
                const video = document.createElement('video');
                video.src = URL.createObjectURL(f);
                video.controls = true;
                video.playsInline = true;
                video.muted = true; // muted by default for UX
                video.onloadeddata = () => URL.revokeObjectURL(video.src);
                vidPreview.appendChild(video);
            });
        })(i);
    }

    // Optional: show previews for single upload (keeps behavior consistent)
    document.getElementById('singleImage').addEventListener('change', function () {
        const p = this.files && this.files[0];
        if (!p) return;
        const w = window.open();
        const img = document.createElement('img');
        img.src = URL.createObjectURL(p);
        img.style.maxWidth = '90vw';
        img.onload = () => URL.revokeObjectURL(img.src);
        w.document.body.style.background = '#111';
        w.document.body.appendChild(img);
    });

    document.getElementById('singleVideo').addEventListener('change', function () {
        const p = this.files && this.files[0];
        if (!p) return;
        const w = window.open();
        const video = document.createElement('video');
        video.src = URL.createObjectURL(p);
        video.controls = true;
        video.style.maxWidth = '90vw';
        video.onloadeddata = () => URL.revokeObjectURL(video.src);
        w.document.body.style.background = '#111';
        w.document.body.appendChild(video);
    });

   
</script>

</body>
</html>
