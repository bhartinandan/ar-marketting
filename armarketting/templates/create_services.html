<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <link rel="shortcut icon" type="image/png" href="{% static 'aflogo.png' %}">
    <title>AliveFrame</title>
    <link rel="icon" type="image/x-icon" href="{% static 'logo.png' %}">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet"> 
    
    <!-- Icon Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Stylesheets -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid position-relative d-flex p-0">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-dark position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->

        <!-- Sign Up Start -->
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-secondary rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <a onclick="window.location.href ='/'">
                                <h4 class="text-info"><i class="fa fa-user-edit me-2"></i>AliveFrame</h4>
                            </a>
                        </div>
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <select class="form-select form-select-lg mb-3" id="service_type" name="service_type" aria-label=".form-select-lg example" required>
                                <option selected>Select Service Type</option>
                                <option value="BASIC">Basic</option>
                                <option value="PREMIUM">Premium</option>
                                <option value="PREMIUM_PLUS">Premium Plus</option>
                            </select>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="campaign_name" name="campaign_name" placeholder="campaign_name" required>
                                <label for="description">Campaingn Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="description" name="description" placeholder="description" required>
                                <label for="description">Campaingn Description</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="campaign_days" name="campaign_days" placeholder="campaign_days" required>
                                <label for="description">Campaingn Days</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="height" name="height" placeholder="height" required>
                                <label for="description">Height</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="width" name="width" placeholder="width" required>
                                <label for="description">Width</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="url" class="form-control" id="redirect_url" name="redirect_url" placeholder="https://example.com" required>
                                <label for="description">Redirect url</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="True" id="status" name="status" checked >
                                <label class="form-check-label" for="status">
                                    Active Campaign
                                </label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="file" class="form-control" id="image" name="refimageUpload">
                                <label for="video">Overlayed Image</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="file" class="form-control" id="image" name="tarimageUpload">
                                <label for="video">Target Image (.mind) </label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="file" class="form-control" id="video" name="videoUpload" accept="video/*" required>
                                <label for="video">AR Video</label>
                            </div>
                            <button type="submit" class="btn btn-info py-3 w-100 mb-4">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Sign Up End -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/chart/chart.min.js' %}"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
    <script src="{% static 'lib/tempusdominus/js/moment.min.js' %}"></script>
    <script src="{% static 'lib/tempusdominus/js/moment-timezone.min.js' %}"></script>
    <script src="{% static 'lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js' %}"></script>

    <!-- Main JS -->
    <script src="{% static 'js/main.js' %}"></script>

    <!-- File Size Check Script -->
    <script>
        document.getElementById('video').addEventListener('change', function () {
            const file = this.files[0];
            const maxSize = 50 * 1024 * 1024; // 50 MB

            if (file && file.size > maxSize) {
                alert("File size must be less than 50 MB.");
                this.value = ""; // Clear file input
            }
        });
    </script>
</body>
</html>
