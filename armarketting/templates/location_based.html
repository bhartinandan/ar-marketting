<!DOCTYPE html>
<html>
<head>
  <title>AliveFrame AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    #enable-gps-btn {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      font-size: 16px;
      background: #0af;
      color: white;
      border: none;
      border-radius: 8px;
      z-index: 100;
      font-family: 'Poppins', sans-serif;
    }

    #visit-button {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #7f00ff;
      color: white;
      padding: 12px 24px;
      width: 90%;
      height: 4rem;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      font-family: 'Poppins', sans-serif;
      opacity: 0.9;
      display: none;
    }

    #footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #666;
      z-index: 9;
    }

    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid #f3f3f3;
      border-top: 6px solid #0af;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      z-index: 99;
      display: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>

<body>
  <button id="enable-gps-btn">Click to Enable GPS</button>
  <button id="visit-button" href="{{data.redirect_url}}">Visit Now</button>
  <div id="footer">Powered By AliveFrame</div>
  <div id="loader"></div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true"
  >
    <a-assets>
      <video
        id="my-video"
        src="{{data.video_asset.url}}"
        crossorigin="anonymous"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        style="display: none;"
      ></video>
    </a-assets>

    <a-camera id="camera" gps-new-camera="gpsMinDistance: 99999" position="0 1.6 0"></a-camera>

    <a-entity id="video-wrapper">
      <a-entity
        id="video"
        visible="false"
        geometry="primitive: plane; height: {{ data.video_height }}; width: {{ data.video_width }}"
        chroma-key-material="src: #my-video; color: 0,1,0"
        position="{{ data.video_position }}"
        face-camera
      ></a-entity>
    </a-entity>
  </a-scene>

  <!-- Chroma Key Shader -->
  <script>
    AFRAME.registerComponent("chroma-key-material", {
      schema: {
        src: { type: "selector" },
        color: { type: "string", default: "0,1,0" }
      },
      init: function () {
        const el = this.el;
        const video = this.data.src;
        const [r, g, b] = this.data.color.split(",").map(Number);
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;

        const material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: videoTexture },
            keyColor: { value: new THREE.Vector3(r, g, b) }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D map;
            uniform vec3 keyColor;
            varying vec2 vUv;
            void main() {
              vec4 texColor = texture2D(map, vUv);
              float diff = distance(texColor.rgb, keyColor);
              if (diff < 0.8) discard;
              gl_FragColor = texColor;
            }
          `,
          transparent: true
        });

        el.getObject3D("mesh").material = material;
      }
    });
  </script>

  <!-- Face-Camera Component -->
  <script>
    AFRAME.registerComponent("face-camera", {
      tick: function () {
        const camera = document.querySelector("#camera");
        if (!camera) return;

        const camPos = camera.object3D.getWorldPosition(new THREE.Vector3());
        this.el.object3D.lookAt(camPos);
      }
    });
  </script>

  <!-- GPS and Orientation Logic -->
  <script>
    let currentHeading = 0;

    function handleOrientation(event) {
      if (event.absolute && event.alpha != null) {
        currentHeading = 360 - event.alpha;
      }
    }

    function requestIOSPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
          } else {
            alert('❌ Permission denied for orientation.');
          }
        }).catch(console.error);
      } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      }
    }

    requestIOSPermission();

    function toRadians(deg) {
      return deg * Math.PI / 180;
    }

    function offsetGPS(lat, lon, distanceMeters, bearingDegrees) {
      const R = 6378137;
      const bearing = toRadians(bearingDegrees);
      const newLat = Math.asin(Math.sin(toRadians(lat)) * Math.cos(distanceMeters / R) +
        Math.cos(toRadians(lat)) * Math.sin(distanceMeters / R) * Math.cos(bearing));
      const newLon = toRadians(lon) + Math.atan2(
        Math.sin(bearing) * Math.sin(distanceMeters / R) * Math.cos(toRadians(lat)),
        Math.cos(distanceMeters / R) - Math.sin(toRadians(lat)) * Math.sin(newLat)
      );
      return {
        latitude: newLat * 180 / Math.PI,
        longitude: newLon * 180 / Math.PI
      };
    }

    document.getElementById("enable-gps-btn").onclick = function () {
document.getElementById("enable-gps-btn").style.display = "none"; // hide immediately
document.getElementById("loader").style.display = "block";

navigator.geolocation.getCurrentPosition(function (position) {

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const heading = currentHeading || 0;

        const front = offsetGPS(lat, lon, 4, heading);
        const target = offsetGPS(front.latitude, front.longitude, 0.5, heading + 90);

        const wrapper = document.getElementById("video-wrapper");
        wrapper.removeAttribute("gps-new-entity-place");

        setTimeout(() => {
          wrapper.setAttribute("gps-new-entity-place", `latitude: ${target.latitude}; longitude: ${target.longitude}`);
        }, 100);

        const vid = document.getElementById("my-video");
        const videoEntity = document.getElementById("video");

        vid.play().then(() => {
          videoEntity.setAttribute("visible", "true");
          document.getElementById("loader").style.display = "none";
          setTimeout(() => {
            document.getElementById("visit-button").style.display = "block";
          }, 6000);
        }).catch(() => {
          document.body.addEventListener("click", () => {
            vid.play();
            videoEntity.setAttribute("visible", "true");
            document.getElementById("loader").style.display = "none";
            setTimeout(() => {
              document.getElementById("visit-button").style.display = "block";
            }, 6000);
          }, { once: true });
        });

      }, function (err) {
        alert("❌ GPS access failed: " + err.message);
        document.getElementById("loader").style.display = "none";
      }, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    };
  </script>
</body>
</html>
